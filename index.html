<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6f4ef'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' font-family='serif' font-weight='700' fill='%23C0392B'%3E%E4%B9%A0%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<title>习惯卡</title>
<style>
/* ============ 基调 ============ */
:root{
  /* 主题三档语义层：日间（默认）/ 夜间 / 跟随系统 */
  --c-bg:#f6f4ef;--c-card:#fffdfa;--c-ink:#1f1d1a;--c-ink2:#5f5b54;--c-ink3:#9a948b;
  --c-line:rgba(var(--ink-rgb),.08);--c-line2:rgba(var(--ink-rgb),.15);--c-dash:rgba(var(--ink-rgb),.24);
  --c-ph:#bcb6ac;--c-danger:#b03a31;--c-danger-bg:rgba(192,57,43,.08);
  --c-dbar:rgba(246,244,239,.86);--c-brand:#33566E;--c-green:#2F7A6B;
  --c-toast-bg:rgba(var(--ink-rgb),.92);--c-toast-fg:#f6f4ef;
  --card-rgb:255,253,250;
  --c-eg-ok:#3f3c36;--c-eg-no:#a9a39a;--c-quote-ink:#3a3833;
  --ink-rgb:31,29,26;
  --bg:var(--c-bg);
  --card:var(--c-card);
  --ink:var(--c-ink);
  --ink-2:var(--c-ink2);
  --ink-3:var(--c-ink3);
  --line:var(--c-line);
  --line2:var(--c-line2);
  --dash:var(--c-dash);
  --ph:var(--c-ph);
  --danger:var(--c-danger);
  --danger-bg:var(--c-danger-bg);
  /* 统一动效令牌：全站过渡只引用这些变量 */
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);   /* 卡片悬浮过冲（历史规格保留） */
  --d-fast:.14s;
  --d-base:.22s;
  --d-slow:.34s;
  --d-spring:.5s;
  color-scheme:light;
}
html[data-theme="dark"]{
  --c-bg:#0f1013;--c-card:#20232a;--c-ink:#eceae2;--c-ink2:#c6c1b7;--c-ink3:#9b968c;
  --c-line:rgba(255,255,255,.12);--c-line2:rgba(255,255,255,.21);--c-dash:rgba(255,255,255,.28);
  --c-ph:#7e7970;--c-danger:#e08a80;--c-danger-bg:rgba(224,138,128,.12);
  --c-dbar:rgba(15,16,19,.88);--c-brand:#5b8db8;--c-green:#3d9b82;
  --c-toast-bg:rgba(236,234,226,.95);--c-toast-fg:#0f1013;
  --c-eg-ok:#d6d1c8;--c-eg-no:#8a857c;--c-quote-ink:#cfcac1;
  --card-rgb:32,35,42;
  --ink-rgb:236,234,226;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --c-bg:#0f1013;--c-card:#20232a;--c-ink:#eceae2;--c-ink2:#c6c1b7;--c-ink3:#9b968c;
    --c-line:rgba(255,255,255,.12);--c-line2:rgba(255,255,255,.21);--c-dash:rgba(255,255,255,.28);
    --c-ph:#7e7970;--c-danger:#e08a80;--c-danger-bg:rgba(224,138,128,.12);
    --c-dbar:rgba(15,16,19,.88);--c-brand:#5b8db8;--c-green:#3d9b82;
    --c-toast-bg:rgba(236,234,226,.95);--c-toast-fg:#0f1013;
    --c-eg-ok:#d6d1c8;--c-eg-no:#8a857c;--c-quote-ink:#cfcac1;
    --card-rgb:32,35,42;
    --ink-rgb:236,234,226;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:14px;line-height:1.6;
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
::placeholder{color:var(--ph);opacity:1}

/* ============ 首页顶栏 ============ */
.top{
  max-width:1168px;margin:0 auto;
  padding:38px 24px 0;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
}
.brand{font-size:16px;font-weight:800;letter-spacing:.06em}
.brand-sub{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.08em}
.io-btns{display:flex;gap:16px;padding-bottom:3px;flex:none}
.io-btn{
  font-size:11px;color:var(--ink-3);background:none;border:none;cursor:pointer;
  padding:2px 0;letter-spacing:.12em;transition:color var(--d-fast) var(--ease);
}
.io-btn:hover{color:var(--ink-2)}
.io-btn:focus-visible{outline:2px solid rgba(var(--ink-rgb),.5);outline-offset:3px;border-radius:2px}
/* 移动端顶栏：去掉品牌标题（省出屏幕给内容），功能按钮等距铺满一行、加大触点 */
@media (max-width:599px){
  .top{padding:16px 16px 0}
  .brand,.brand-sub{display:none}
  .io-btns{flex:1;justify-content:space-between;gap:0}
  .io-btn{font-size:12px;padding:8px 4px;letter-spacing:.05em;white-space:nowrap}
  .dbar-in{padding:10px 14px 8px}
  .dbar-brand{display:none}
  .dbar-in .io-btns{gap:14px}
  .dbar-in .io-btn{padding:6px 4px}
}

/* ============ 卡片墙 ============ */
.grid{
  max-width:1168px;margin:22px auto 0;padding:0 24px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;
}
@media (max-width:1199px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:599px){.grid{grid-template-columns:1fr}}

.cell{
  position:relative;min-height:208px;
  isolation:isolate;                 /* 为下方光效建立层叠上下文 */
  animation:rise var(--d-base) var(--ease) backwards;   /* backwards：延迟期隐藏、结束后不残留 fill，否则 fill 会一直压住 :hover 的 transform */
  animation-delay:calc(var(--i,0)*40ms);
  transition:transform var(--d-spring) var(--ease-spring);   /* 控制点>1，带轻微过冲的弹簧手感 */
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cell:hover{transform:translateY(-7px);will-change:transform}
.cell:active{
  transform:translateY(-2px) scale(.995);
  transition-duration:.12s;
}

/* 第 1 层 · 卡面渐变 + 第 2 层 · 角落光斑 + 第 3 层 · 底部光效 */
.card{
  position:relative;display:flex;flex-direction:column;
  height:100%;min-height:208px;
  overflow:hidden;   /* 序号水印被圆角裁切贴合的前提；box-shadow 不受影响 */
  z-index:1;         /* 保证光效压在卡片下方 */
  border-radius:24px;padding:16px 18px 14px;
  text-decoration:none;color:inherit;cursor:pointer;
  background:
    linear-gradient(150deg,var(--tint-12) 0%,transparent 46%),
    linear-gradient(330deg,var(--tint-06) 0%,transparent 38%),
    linear-gradient(315deg,transparent 0%,transparent 30%,var(--card) 78%),
    radial-gradient(rgba(var(--ink-rgb),.05) 1px,transparent 1px),
    var(--card);
  background-size:auto,auto,auto,12px 12px;
  background-position:0 0;
  background-blend-mode:normal;   /* 养成卡：右下角极淡点阵，向左上渐隐 */
  box-shadow:0 1px 2px rgba(var(--ink-rgb),.04);
  transition:box-shadow var(--d-slow) var(--ease);
}

/* 戒除卡：1px 实线轮廓 + 右上折角 + 左上斜纹（与养成卡互斥的差异信号） */
.card.is-quit{
  border:1px solid rgba(var(--ink-rgb),.15);
  padding-top:17px;padding-right:19px;   /* 比养成卡各减 1px，保持内部对齐 */
  background:
    linear-gradient(150deg,var(--tint-12) 0%,transparent 46%),
    linear-gradient(330deg,var(--tint-06) 0%,transparent 38%),
    linear-gradient(135deg,transparent 0%,transparent 30%,var(--card) 78%),
    repeating-linear-gradient(45deg,rgba(var(--ink-rgb),.035) 0 1px,transparent 1px 10px),
    var(--card);
  background-size:auto,auto,auto,auto;
  background-position:0 0;
  background-blend-mode:normal;
}
.card.is-quit::after{
  content:"";position:absolute;top:-1px;right:-1px;
  width:22px;height:22px;
  background:linear-gradient(225deg,var(--bg) 0 49%,rgba(var(--ink-rgb),.15) 49% 51%,transparent 51%);
  border-top-right-radius:0;
  pointer-events:none;
}
.cell:hover .card{
  box-shadow:0 18px 44px -18px var(--tint-45),0 2px 6px rgba(var(--ink-rgb),.05);
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 82% 6%,var(--tint-20),transparent 58%);
  opacity:.9;transition:opacity var(--d-slow) var(--ease),transform var(--d-slow) var(--ease);
}
.cell:hover .card::before{opacity:1;transform:scale(1.15)}

/* 卡内元素随卡抬起：整卡被拿起的层次，不是一层皮在动 */
.cell:hover .card-title{transform:translateY(-1px)}
.cell:hover .card-arrow{transform:translate(2px,-2px);opacity:.6}
.cell:hover .chip{filter:brightness(.97)}

/* 第 3 层 · 底部双层光：两条不同频率叠加（2.4s × 1.55s 不可整除），才有"一闪一闪"的节奏 */
.cell::before,
.cell::after{
  content:"";position:absolute;pointer-events:none;
  left:0;right:0;border-radius:50%;
  background:var(--theme);
  z-index:-1;
  /* 移出时快速收干净；transform 一并接管，避免脉冲撤掉时 scaleX 瞬跳 */
  transition:opacity var(--d-fast) var(--ease-in),transform var(--d-fast) var(--ease-in);
}
/* 外层宽光晕：慢，负责"照亮桌面" */
.cell::before{
  bottom:-24px;height:46px;left:6%;right:6%;
  filter:blur(28px);
  opacity:var(--go-b,0);
}
/* 内层亮带：快，负责"闪" */
.cell::after{
  bottom:-9px;height:15px;left:16%;right:16%;
  filter:blur(9px);
  opacity:var(--go-c,0);
}
/* 脉冲只由 .is-hover 驱动（JS 在 pointerenter/pointerleave 里同步挂卸），退出零延迟 */
.cell.is-hover::before{animation:glowWide 2.4s ease-in-out .08s infinite}
.cell.is-hover::after{animation:glowCore 1.55s ease-in-out .08s infinite}
@keyframes glowWide{
  0%,100%{opacity:.15}
  50%    {opacity:.5}
}
@keyframes glowCore{
  0%,100%{opacity:.18;transform:scaleX(.94)}
  48%    {opacity:.72;transform:scaleX(1.04)}
}
.card:focus-visible{outline:2px solid var(--theme);outline-offset:3px}

/* 序号水印：印在卡里 —— 被圆角裁切 + multiply 融合 + 随卡同步微动 */
.wm{
  position:absolute;
  right:-4px;bottom:-16px;      /* 右侧与底边微量出血，被圆角裁掉一小部分 */
  font-size:104px;font-weight:900;line-height:.78;letter-spacing:-6px;
  color:var(--theme);opacity:.13;
  mix-blend-mode:multiply;      /* 与卡面渐变融合，去掉贴纸感 */
  font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none;pointer-events:none;z-index:0;
  transform:translateZ(0);
  transition:opacity var(--d-spring) var(--ease-spring),transform var(--d-spring) var(--ease-spring);
}
@media (max-width:599px){.wm{font-size:80px;right:-2px;bottom:-12px}}
.cell:hover .wm{opacity:.19;transform:translateY(-2px)}
/* 戒除卡序号划痕：wm 自身 opacity .13 会作用到整组，线用 .8（实际约 .10，与数字同档、更实） */
.card.is-quit .wm::after{
  content:"";position:absolute;left:-6%;right:-6%;top:52%;height:3px;
  background:var(--theme);opacity:.8;
  transform:rotate(-12deg);transform-origin:center;
  border-radius:2px;
}

/* 卡面内容（最多 4 个文本元素） */
.card-top{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.chip{
  font-size:11px;font-weight:600;line-height:1.4;
  color:var(--theme-deep);background:var(--tint-12);
  border-radius:999px;padding:3px 10px;white-space:nowrap;
  transition:filter var(--d-slow) var(--ease);
}
.no-mini{
  font-size:11px;color:var(--ink-3);letter-spacing:2px;
  font-variant-numeric:tabular-nums;
  line-height:1;position:relative;top:-.5px;   /* 与类型标签视觉对齐 */
}
.card-mid{position:relative;z-index:1;flex:1;display:flex;align-items:center;min-height:0;padding:8px 0}
.card-title{
  font-size:17px;font-weight:700;line-height:1.5;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;overflow-wrap:anywhere;
  transition:transform var(--d-spring) var(--ease-spring);
}
.card-title.is-empty{color:var(--ink-3);font-weight:600}
.card-foot{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.card-status{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.card-arrow{font-size:14px;opacity:.35;line-height:1;display:inline-block;transition:transform var(--d-slow) var(--ease),opacity var(--d-slow) var(--ease)}

/* 新建卡 */
.add-card{
  width:100%;height:100%;min-height:208px;
  border:1.5px dashed rgba(var(--ink-rgb),.22);border-radius:24px;
  background:transparent;color:var(--ink-3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:border-color var(--d-base) var(--ease),background var(--d-base) var(--ease),color var(--d-base) var(--ease);
}
.add-card:hover{border-color:rgba(var(--ink-rgb),.42);background:rgba(var(--card-rgb),.7);color:var(--ink-2)}
.add-card:focus-visible{outline:2px solid rgba(var(--ink-rgb),.5);outline-offset:3px}
.add-card .plus{font-size:22px;font-weight:300;line-height:1}
.add-card .add-txt{font-size:13px;letter-spacing:.14em}

/* ============ 详情页 ============ */
.dbar{
  position:sticky;top:0;z-index:40;
  background:var(--c-dbar);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dbar-in{max-width:808px;margin:0 auto;padding:12px 24px 8px}
.back{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--ink-2);background:none;border:none;cursor:pointer;
  padding:4px 10px;margin-left:-10px;border-radius:999px;transition:background var(--d-fast) var(--ease),color var(--d-fast) var(--ease);
}
.back:hover{color:var(--ink);background:rgba(var(--ink-rgb),.05)}
.back:focus-visible{outline:2px solid rgba(var(--ink-rgb),.5);outline-offset:2px}
.detail{max-width:808px;margin:0 auto;padding:10px 24px 96px}

.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.d-title-wrap{flex:1 1 320px;min-width:0}
.d-title{font-size:22px;font-weight:800;line-height:1.45;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-title .is-empty{color:var(--ink-3)}
.d-chip{flex:none;transform:translateY(-1px)}
.d-title-in{
  width:100%;font-size:22px;font-weight:800;color:var(--ink);
  background:transparent;border:none;border-bottom:1px dashed var(--dash);
  padding:0 0 4px;outline:none;line-height:1.4;
}
.d-title-in:focus{border-bottom-color:var(--theme)}
.diff{
  flex:none;display:flex;padding:3px;gap:2px;
  border:1px solid var(--line);border-radius:999px;background:rgba(var(--card-rgb),.7);
}
.diff-b{
  border:none;background:none;cursor:pointer;
  font-size:11px;color:var(--ink-3);padding:3px 10px;border-radius:999px;
  transition:color var(--d-fast) var(--ease),background var(--d-fast) var(--ease);white-space:nowrap;
}
.diff-b:hover{color:var(--ink-2)}
.diff-b.on{background:var(--tint-12);color:var(--theme-deep);font-weight:600}

.identity{
  margin-top:14px;border:1.5px dashed var(--dash);border-radius:16px;
  padding:12px 16px 13px;background:rgba(var(--card-rgb),.6);
}
.mini-lbl{font-size:10px;letter-spacing:.22em;color:var(--ink-3)}
.id-txt{font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.id-txt.is-empty,.env-txt.is-empty{color:var(--ph)}

.edit-tools{margin-top:6px}
.tool-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.tool-row>.mini-lbl{flex:none}
.type-switch{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.type-switch button{
  border:none;background:none;cursor:pointer;
  font-size:11px;color:var(--ink-3);padding:3px 14px;border-radius:999px;
  transition:color var(--d-fast) var(--ease),background var(--d-fast) var(--ease);
}
.type-switch button.on{background:var(--tint-12);color:var(--theme-deep);font-weight:600}
.theme-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.theme-dot{
  width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;padding:0;
  transition:transform var(--d-fast) var(--ease),box-shadow var(--d-fast) var(--ease);
}
.theme-dot:hover{transform:scale(1.14)}
.theme-dot:focus-visible{outline:2px solid rgba(var(--ink-rgb),.5);outline-offset:2px}
.theme-dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--dot)}

/* 四张定律小卡：2×2，同行等高 */
.laws{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:640px){.laws{grid-template-columns:1fr}}
.law{
  position:relative;border-radius:16px;padding:14px 16px 16px;
  background:linear-gradient(150deg,var(--tint-06) 0%,transparent 55%),var(--card);
  box-shadow:0 1px 2px rgba(var(--ink-rgb),.04);
}
.law-head{display:flex;align-items:center;gap:8px;padding-right:14px}
/* 栏目标号：养成实心圆底白字，戒除空心圆环主题色字（数字用 1/2/3/4） */
.law-no{line-height:1;flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
[data-type="build"] .law-no{background:var(--theme);color:#fff}
[data-type="quit"] .law-no{border:1.5px solid var(--theme);color:var(--theme-deep);background:transparent}
.law-title{font-size:14px;font-weight:700;letter-spacing:.02em}
.law-dot{
  position:absolute;top:13px;right:13px;width:6px;height:6px;border-radius:50%;
  border:1.5px solid var(--ink-3);opacity:.75;
}
.law-row{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.law-tag{
  flex:none;font-size:10px;font-weight:600;line-height:1.5;
  color:var(--theme-deep);background:var(--tint-12);
  border-radius:999px;padding:2px 8px;margin-top:2px;white-space:nowrap;
}
.law-text{font-size:13px;color:var(--ink-2);line-height:1.65;min-width:0;overflow-wrap:anywhere}
.law-text.is-empty{color:var(--ph)}
.row-ta{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.65}

/* 环境框（容器，层级低于定律卡） */
.env{
  margin-top:16px;border:1.5px dashed rgba(var(--ink-rgb),.17);border-radius:16px;
  padding:11px 16px 13px;background:rgba(var(--card-rgb),.45);
}
.env-txt{font-size:13px;color:var(--ink-2);margin-top:3px;overflow-wrap:anywhere}

/* 周复盘：横线纸 */
.review{margin-top:22px}
.review>.mini-lbl,.p-note>.mini-lbl{margin-bottom:6px;display:block}
.lined{
  display:block;width:100%;border:none;outline:none;resize:none;overflow:hidden;
  font-size:13px;line-height:25px;color:var(--ink);

.mask{

.p-close{

}

}

}
.p-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px}

"这张卡为什么长这样，每一栏该写什么。":"Why the card is shaped this way, and what to write in each field.",
"怎么用":"How to use","每一栏填什么":"What goes in each field","为什么这么设计":"Why it\u2019s designed this way","学习进度台教程":"Progress console tutorial",
"这张卡不是日记，是模具。填一次，之后每天只做一件事——打勾。":"This card is not a diary \u2014 it\u2019s a mold. Fill it in once; after that there\u2019s only one thing to do each day: check the box.",
"步骤一 · 先建一张卡":"Step 1 \u00b7 Create one card",
"只建一张。同时开三张卡的人，最后一张都活不过两周。":"Create just one. People who start three cards at once rarely keep any past two weeks.",
"在首页点「＋ 新建卡」，选「养成」或「戒除」，写一个动作名称。名称要写动作，不写愿望：「每天背 50 个单词」可以，「好好学英语」不行。":"On the home page tap \u201c＋ New card\u201d, choose Build or Quit, and name an action. Name the action, not the wish: \u201cmemorize 50 words a day\u201d works; \u201cget good at English\u201d does not.",
"步骤二 · 把四栏填满，再开始打卡":"Step 2 \u00b7 Fill all four columns, then start checking in",
"四栏是四个不同的着力点，缺哪一栏，习惯就从哪里断。填不满就先空着，卡片右上角那个空心圆点就是提醒你「这张还没设计完」。":"The four columns are four different leverage points \u2014 whichever one is missing is where the habit breaks. Leave them empty if you must; the hollow dot at the top-right of the card reminds you that this card isn\u2019t fully designed yet.",
"没填满就先别打卡——打卡只是在验证设计，设计没做完，打卡只会记下失败。":"Don\u2019t check in before it\u2019s complete \u2014 checking in only verifies the design. With the design unfinished, check-ins just record failure.",
"步骤三 · 每天点一格":"Step 3 \u00b7 Check one box a day",
"点卡片进详情，按「打卡」，把今天那格点亮。养成卡填勾，戒除卡填「守」。":"Open a card\u2019s detail, tap Check in, and light up today\u2019s box. Build cards earn a check; quit cards earn a \u201cheld\u201d mark.",
"步骤四 · 每周写一次复盘":"Step 4 \u00b7 Write a weekly review",
"在卡片底部手写一段，只回答一个问题：这周哪一栏的实际执行，跟你当初写的不一样？":"At the bottom of the card, write a short note answering one question: which column actually played out this week differently from what you wrote?",
"然后只改那一栏。不要重写整张卡。":"Then change only that column. Never rewrite the whole card.",

  "目标「":"goal \u201c","」达成，恭喜！":"\u201d achieved \u2014 congratulations!",
  "，可以继续追加。":", and you can keep adding."
};

function hasCJK(s){ return /[\u4e00-\u9fa5]/.test(s); }
function applyRules(s){
  for(var i=0;i<RULES.length;i++){
    var r=RULES[i];
    if(r[0].test(s)) s=s.replace(r[0],r[1]);
  }
  return s;
}
function t(s){
  if(typeof s!=="string"||!hasCJK(s)||lang()!=="en")return s;
  if(Object.prototype.hasOwnProperty.call(TR,s))return TR[s];
  var st=s.replace(/^\s+|\s+$/g,"");
  if(st&&Object.prototype.hasOwnProperty.call(TR,st)){
    var lead=s.slice(0,s.indexOf(st));
    var trail=s.slice(s.indexOf(st)+st.length);
    return lead+TR[st]+trail;
  }
  if(Object.prototype.hasOwnProperty.call(FRAG,s))return FRAG[s];
  s=applyRules(s);
  return s;
}

/* ---------- 文本节点 + 属性遍历 ---------- */
var applying=false;
function walk(root){
  if(applying||lang()!=="en"||!root)return;
  applying=true;
  try{
    var tw=DOC.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
    while((n=tw.nextNode())){
      var v=n.nodeValue;
      if(v&&hasCJK(v)){
        var nv=t(v);
        if(nv!==v)n.nodeValue=nv;
      }
    }
    if(root.querySelectorAll){
      var all=root.querySelectorAll("*");
      for(var i=0;i<all.length;i++){
        var el=all[i];
        for(var j=0;j<3;j++){
          var a=["placeholder","title","aria-label"][j];
          var av=el.getAttribute(a);
          if(av&&hasCJK(av)){
            var an=t(av);
            if(an!==av)el.setAttribute(a,an);
          }
        }
      }
    }
  }finally{applying=false;}
}
function pass(root){
  if(applying||lang()!=="en")return;
  walk(root||DOC.body);
  ensureShadow();
}

/* ---------- title 与原生弹窗的翻译挂钩 ---------- */
(function(){
  var d=Object.getOwnPropertyDescriptor(Document.prototype,"title");
  if(d&&d.set)Object.defineProperty(document,"title",{
    get:function(){return d.get.call(document);},
    set:function(v){d.set.call(document,typeof v==="string"?t(v):v);}
  });
  var _cf=window.confirm,_pr=window.prompt,_al=window.alert;
  window.confirm=function(m){return _cf.call(window,typeof m==="string"?t(m):m);};
  window.prompt=function(m,d2){return _pr.call(window,typeof m==="string"?t(m):m,d2);};
  window.alert=function(m){return _al.call(window,typeof m==="string"?t(m):m);};
})();

/* ---------- 观察者：渲染后自动翻译 ---------- */
var shadowObs=null;
function ensureShadow(){
  if(shadowObs||lang()!=="en")return;
  var host=DOC.getElementById("goalsHost");
  if(host&&host.shadowRoot){
    shadowObs=new MutationObserver(function(){
      if(applying)return;
      walk(host.shadowRoot);
      /* 二次补扫：渲染后紧跟的异步改写（如 select/进度条初始化）会在首轮遍历窗口内落地 */
      setTimeout(function(){ if(!applying) walk(host.shadowRoot); },120);
    });
    shadowObs.observe(host.shadowRoot,{childList:true,subtree:true,characterData:true});
    walk(host.shadowRoot);
    setTimeout(function(){ if(!applying) walk(host.shadowRoot); },120);
  }
}
var obs=new MutationObserver(function(){ if(!applying) pass(); });
function boot(){
  DOC.documentElement.lang = lang()==="en"?"en":"zh-CN";
  obs.observe(DOC.body,{childList:true,subtree:true,characterData:true});
  pass();
}
if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",boot);
else boot();
function toggle(){
  setLang(lang()==="en"?"zh":"en");
  DOC.documentElement.lang = lang()==="en"?"en":"zh-CN";
  if(shadowObs){shadowObs.disconnect();shadowObs=null;}
  if(typeof renderCurrent==="function")renderCurrent(false);
  setTimeout(function(){ pass(); },80);
}
return { t:t, lang:lang, setLang:setLang, toggle:toggle, pass:pass };
})();
</script>
<script>
/* ================= 云同步（登录 + 快照式同步适配器） ================= */
var SYNC = (function(){
  "use strict";
  var KEYS = ["habitcard_v1", "goal_workspace_v1", "hc_theme"];   /* 本项目用户数据键（wbsync_* 与 *_broken 不在此列） */
  var P = "wbsync_";
  var pushTimer = null, applying = false, conflictPending = null, panelMask = null;

  function isLoggedIn(){ return !!localStorage.getItem(P + "token"); }
  function userEmail(){ return localStorage.getItem(P + "email") || ""; }
  function localUpdated(){ return Number(localStorage.getItem(P + "updated_at") || 0); }
  function lastSync(){ return Number(localStorage.getItem(P + "last_sync") || 0); }
  function ownsKey(k){ return KEYS.indexOf(k) >= 0; }

  /* 快照式适配器：collect 打包 / apply 还原（键清单变化只改这里，框架不动） */
  function collect(){
    var o = { _app: "habit-cards", _v: 1 };
    KEYS.forEach(function(k){ var v = localStorage.getItem(k); if (v != null) o[k] = v; });
    o._updated_at = localUpdated();
    return o;
  }
  function apply(json){
    if (!json || typeof json !== "object") return [];
    var backed = [];
    applying = true;
    try {
      KEYS.forEach(function(k){
        if (json[k] != null) {
          var old = localStorage.getItem(k);
          if (old !== null && old !== json[k]) { localStorage.setItem(P + "backup_" + k, old); backed.push(k); }
          localStorage.setItem(k, json[k]);
        }
      });
      if (json._updated_at) localStorage.setItem(P + "updated_at", String(json._updated_at));
      try { document.dispatchEvent(new CustomEvent("wbsync:applied")); } catch(e){}   /* 通知宿主同步内存 state */
    } finally { applying = false; }
    return backed;
  }
  function touch(k){
    if (!ownsKey(k) || applying) return;
    localStorage.setItem(P + "updated_at", String(Date.now()));
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ push(); }, 3000);   /* 防抖 3 秒自动上传 */
  }
  /* setItem 钩子：业务写 localStorage 即触发（模块先于业务脚本加载） */
  (function(){
    var orig = Storage.prototype.setItem;
    Storage.prototype.setItem = function(k, v){
      orig.call(this, k, v);
      try { if (ownsKey(k)) touch(k); } catch(e){}
    };
  })();

  function api(path, opt){
    opt = opt || {};
    var headers = { "content-type": "application/json" };
    var tk = localStorage.getItem(P + "token");
    if (tk) headers.authorization = "Bearer " + tk;
    return fetch(path, {
      method: opt.method || "GET",
      headers: headers,
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ j._status = r.status; return j; });
    });
  }
  function withRetry(fn, n){   /* 失败静默重试（自动同步绝不弹窗） */
    return fn().catch(function(e){
      return n > 1 ? new Promise(function(res){ setTimeout(res, 1000); }).then(function(){ return withRetry(fn, n - 1); }) : Promise.reject(e);
    });
  }
  function push(){
    if (!isLoggedIn() || applying || conflictPending) return Promise.resolve(false);
    var body = { data: collect(), updated_at: localUpdated() };
    return withRetry(function(){ return api("/api/state", { method: "PUT", body: body }); }, 3)
      .then(function(j){
        if (j.ok) localStorage.setItem(P + "last_sync", String(j.updated_at || localUpdated()));
        return true;
      })
      .catch(function(){ return false; });
  }
  function syncNow(){
    return withRetry(function(){ return api("/api/state"); }, 3).then(function(j){
      if (!j.ok) return { status: "fail" };
      var C = j.updated_at || 0, data = j.data;
      var L = localUpdated(), S = lastSync();
      var cloudChanged = C > S, localChanged = L > S;
      if (!data) return push().then(function(ok){ return { status: ok ? "pushed" : "fail" }; });  /* 云端还没有快照：上传本机数据 */
      if (cloudChanged && !localChanged){ apply(data); return { status: "applied", data: data }; }
      if (localChanged && !cloudChanged) return push().then(function(ok){ return { status: ok ? "pushed" : "fail" }; });
      if (!cloudChanged && !localChanged) return { status: "same" };
      var lens = {};
      KEYS.forEach(function(k){ var v = localStorage.getItem(k); lens[k] = v != null ? v.length : 0; });
      conflictPending = { data: data, updated_at: C, localLens: lens };
      return { status: "conflict", conflictPending: conflictPending };
    });
  }
  function register(email, pass){
    return api("/api/register", { method: "POST", body: { email: email, pass: pass } })
      .then(function(j){ if (j.ok) afterAuth(j); return j; });
  }
  function login(email, pass){
    return api("/api/login", { method: "POST", body: { email: email, pass: pass } })
      .then(function(j){ if (j.ok) afterAuth(j); return j; });
  }
  function afterAuth(j){
    localStorage.setItem(P + "token", j.token);
    localStorage.setItem(P + "email", j.email);
    conflictPending = null;
  }
  function logout(){
    api("/api/session", { method: "DELETE" }).catch(function(){});
    localStorage.removeItem(P + "token");
    localStorage.removeItem(P + "email");
  }
  function fmtTime(ms){
    if (!ms) return "—";
    var d = new Date(ms);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  /* ---- 云同步面板（注册/登录/状态/手动同步/退出/冲突选择） ---- */
  function openPanel(){
    close();
    var mask = document.createElement("div");
    mask.className = "mask";
    mask.innerHTML =
      '<div class="panel" role="dialog" aria-modal="true" aria-label="云同步">'+
        '<button class="p-close" aria-label="关闭">×</button>'+
        '<div class="p-ctx">云同步 · <b>' + esc(isLoggedIn() ? userEmail() : "未登录") + '</b></div>'+
        '<div id="syncBody"></div>'+
      '</div>';
    document.body.appendChild(mask);
    panelMask = mask;
    mask.addEventListener("click", function(e){ if (e.target === mask) close(); });
    mask.querySelector(".p-close").addEventListener("click", close);
    document.addEventListener("keydown", escClose);
    renderBody();
  }
  function escClose(e){ if (e.key === "Escape") close(); }
  function close(){
    if (!panelMask) return;
    panelMask.remove(); panelMask = null;
    document.removeEventListener("keydown", escClose);
  }
  /* ---- 首访公告：告知数据仅存本机、登录后才上云（勾选「以后不再提示」或已登录则不再弹出） ---- */
  var NOTICE_KEY = "wbsync_notice_seen";   /* 每设备标记，不入同步快照 */
  var noticeMask = null;
  function closeNotice(){
    if (!noticeMask) return;
    noticeMask.remove(); noticeMask = null;
    document.removeEventListener("keydown", noticeEsc);
  }
  function dismissNotice(){
    var cb = noticeMask && noticeMask.querySelector("#noticeNever");
    if (cb && cb.checked) localStorage.setItem(NOTICE_KEY, "1");
    closeNotice();
  }
  function noticeEsc(e){ if (e.key === "Escape") dismissNotice(); }
  function maybeShowNotice(){
    if (noticeMask) return;
    if (localStorage.getItem(NOTICE_KEY) || isLoggedIn()) return;
    setTimeout(function(){
      if (noticeMask || isLoggedIn() || localStorage.getItem(NOTICE_KEY)) return;
      noticeMask = document.createElement("div");
      noticeMask.className = "mask";
      noticeMask.innerHTML =
        '<div class="panel" role="dialog" aria-modal="true" aria-label="公告">'+
          '<button class="p-close" aria-label="关闭">×</button>'+
          '<div class="p-ctx">📢 公告 · 你的数据怎么保存</div>'+
          '<div class="sync-status">目前所有数据都保存在<b>这台设备的浏览器</b>里——清除浏览器数据或换一台设备，记录就找不回来了。<br>使用<b>邮箱注册 / 登录</b>后，数据会自动同步到云端：换手机、换电脑、清缓存都不怕丢。</div>'+
          '<div class="sync-btns"><button class="btn btn-primary" id="noticeGo">去登录 / 注册</button><button class="btn btn-ghost" id="noticeOk">先逛逛</button></div>'+
          '<label class="notice-never"><input type="checkbox" id="noticeNever">以后不再提示</label>'+
        '</div>';
      document.body.appendChild(noticeMask);
      noticeMask.addEventListener("click", function(e){ if (e.target === noticeMask) dismissNotice(); });
      noticeMask.querySelector(".p-close").addEventListener("click", dismissNotice);
      noticeMask.querySelector("#noticeGo").addEventListener("click", function(){
        if (noticeMask.querySelector("#noticeNever").checked) localStorage.setItem(NOTICE_KEY, "1");
        closeNotice();
        openPanel();
      });
      noticeMask.querySelector("#noticeOk").addEventListener("click", dismissNotice);
      document.addEventListener("keydown", noticeEsc);
    }, 450);
  }
  function renderBody(){
    if (!panelMask) return;
    var ctxB = panelMask.querySelector(".p-ctx b");
    if (ctxB) ctxB.textContent = isLoggedIn() ? userEmail() : "未登录";
    var box = panelMask.querySelector("#syncBody");
    var html = "";
    if (conflictPending) {
      var d = conflictPending.data;
      html += '<div class="sync-status">云端与本地<b>都有改动</b>，请选择保留哪一侧（另一侧会被覆盖，本地旧值自动备份）：</div>';
      KEYS.forEach(function(k){
        var l = conflictPending.localLens[k] || 0;
        var c = d[k] != null ? String(d[k]).length : 0;
        html += '<div class="sync-keyrow"><b>' + k + '</b><span>本地 ' + (l ? l + 'B' : '无') + ' · 云端 ' + (c ? c + 'B' : '无') + '</span></div>';
      });
      html += '<div class="sync-btns"><button class="btn btn-primary" id="syncUseCloud">采用云端</button><button class="btn btn-ghost" id="syncUseLocal">采用本地</button></div>';
    } else if (isLoggedIn()) {
      html += '<div class="sync-status">已登录 <b>' + esc(userEmail()) + '</b> · 上次同步 ' + fmtTime(lastSync()) + '<br>本地改动约 3 秒后自动上传；断网时一切照旧，联网后自动补传。</div>';
      html += '<div class="sync-btns"><button class="btn btn-primary" id="syncNow">立即同步</button><button class="btn btn-ghost" id="syncLogout">退出登录</button></div>';
    } else {
      html += '<div class="sync-row"><label for="syncEmail">邮箱</label><input id="syncEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>'+
              '<div class="sync-row"><label for="syncPass">密码（6–72 位）</label><input id="syncPass" type="password" autocomplete="current-password" placeholder="至少 6 位"></div>'+
              '<div class="sync-btns"><button class="btn btn-primary" id="syncLogin">登录</button><button class="btn btn-ghost" id="syncRegister">注册新账号</button></div>'+
              '<div class="sync-status">未登录时数据仅保存在本机浏览器；注册登录后自动云同步，换设备不丢。</div>';
    }
    box.innerHTML = html;
    if (conflictPending) {
      box.querySelector("#syncUseCloud").addEventListener("click", function(){
        var backed = apply(conflictPending.data);
        localStorage.setItem(P + "last_sync", String(conflictPending.updated_at));
        localStorage.setItem(P + "updated_at", String(conflictPending.data._updated_at || conflictPending.updated_at));
        conflictPending = null;
        applyThemeMode(); renderCurrent(false);
        toast(backed.length ? "已采用云端（被覆盖的本地旧值已备份）" : "已采用云端");
        renderBody();
      });
      box.querySelector("#syncUseLocal").addEventListener("click", function(){
        push().then(function(){
          conflictPending = null;
          toast("已采用本地并上传云端");
          renderBody();
        });
      });
    } else if (isLoggedIn()) {
      box.querySelector("#syncNow").addEventListener("click", function(){
        this.disabled = true; this.textContent = "同步中…";
        syncNow().then(function(st){
          if (st.status === "applied") { renderCurrent(false); toast("已从云端恢复最新数据"); }
          if (st.status === "pushed") toast("已上传云端");
          renderBody();
        });
      });
      box.querySelector("#syncLogout").addEventListener("click", function(){
        logout(); toast("已退出登录，数据保留在本机"); renderBody();
      });
    } else {
      box.querySelector("#syncLogin").addEventListener("click", function(){ authFlow("login"); });
      box.querySelector("#syncRegister").addEventListener("click", function(){ authFlow("register"); });
      box.querySelector("#syncPass").addEventListener("keydown", function(e){ if (e.key === "Enter") authFlow("login"); });
    }
  }
  function authFlow(kind){
    if (!panelMask) return;
    var email = panelMask.querySelector("#syncEmail").value.trim();
    var pass = panelMask.querySelector("#syncPass").value;
    if (!/^[^\s@]{1,64}@[^\s@]+\.[^\s@]{1,}$/.test(email)) { toast("邮箱格式不正确"); return; }
    if (pass.length < 6) { toast("密码至少 6 位"); return; }
    (kind === "login" ? login(email, pass) : register(email, pass))
      .then(function(j){
        if (!j.ok) { toast(j.error || "操作失败"); return; }
        toast(kind === "login" ? "登录成功，正在比对云端…" : "注册成功，正在上传本地数据…");
        renderBody();
        syncNow().then(function(st){
          if (st.status === "applied") { renderCurrent(false); toast("已从云端恢复数据"); }
          if (st.status === "conflict") openPanel();   /* 双边都有改动：弹摘要选择 */
          renderBody();
        });
      });
  }
  return { KEYS: KEYS, ownsKey: ownsKey, touch: touch, isLoggedIn: isLoggedIn, collect: collect, apply: apply, push: push, syncNow: syncNow, openPanel: openPanel, close: close, maybeShowNotice: maybeShowNotice };
})();
</script>

radius:12px;padding:4px;gap:4px}\n  .nav button{\n    flex:1;min-height:44px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);\n    display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;\n  }\n  .nav button.active{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(28,35,51,.10)}\n\n  /* ---------- Layout ---------- */\n  main{max-width:960px;margin:0 auto;padding:16px 20px 90px}\n  .tab-panel{display:none;animation:fadeUp .3s ease}\n  .tab-panel.active{display:block}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n\n  .card{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}\n  .card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}\n  .card-title .dot{width:8px;height:8px;border-radius:3px;background:var(--brand);flex:none}\n  .muted{color:var(--ink-2);font-size:13px}\n  .tiny{font-size:12px;color:var(--ink-3)}\n\n  /* ---------- Backup banner ---------- */\n  .backup-banner{\n    display:none;align-items:center;gap:10px;background:#fffbeb;border:1px solid #fde68a;\n    border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#92400e;\n  }\n  .backup-banner.show{display:flex}\n  .backup-banner .spacer{flex:1}\n  .backup-banner button{\n    min-height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;\n  }\n  .backup-banner .go{background:var(--amber);color:#fff}\n  .backup-banner .later{color:#92400e}\n\n  /* ---------- Today zone ---------- */\n  .quick-add-row{display:flex;justify-content:flex-end;margin:-2px 0 14px}\n  .quick-add-row .btn{box-shadow:none}\n  .today-zone{margin-bottom:14px}\n  .missed-card{\n    background:linear-gradient(135deg,#fef2f2,#fff5f5);border:1.5px solid #fecaca;\n    border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;\n    display:flex;align-items:center;gap:12px;animation:pulse-border 2s infinite;\n  }\n  @keyframes pulse-border{0%,100%{border-color:#fecaca}50%{border-color:#f87171}}\n  .missed-card .icon{\n    width:40px;height:40px;border-radius:12px;background:#fee2e2;color:var(--red);\n    display:flex;align-items:center;justify-content:center;flex:none;\n  }\n  .missed-card .info{flex:1;min-width:0}\n  .missed-card .info b{font-size:14px}\n  .missed-card .info .why{color:var(--red);font-size:12px;font-weight:600}\n  .missed-card .actions{display:flex;flex-direction:column;gap:8px;flex:none}\n  .rest-card{\n    background:linear-gradient(135deg,#fffbeb,#fffdf5);border:1.5px solid #fde68a;\n    border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;\n    display:flex;align-items:center;gap:12px;\n  }\n  .rest-card .icon{\n    width:40px;height:40px;border-radius:12px;background:#fef3c7;color:var(--amber);\n    display:flex;align-items:center;justify-content:center;flex:none;\n  }\n  .rest-card .info{flex:1;min-width:0}\n  .rest-card .info b{font-size:14px}\n  .rest-card .info .why{color:#b45309;font-size:12px;font-weight:600}\n  .plan-line{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.5;display:flex;gap:5px;align-items:flex-start}\n  .plan-line .tag-rest{flex:none;font-weight:700;color:var(--brand)}\n  .plan-line-board{font-size:12px;color:var(--ink-2);background:#f6f7fd;border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.5}\n  .plan-line-board b{color:var(--brand)}\n  .btn-amber{background:var(--amber);color:#fff}\n  .btn{\n    min-height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;\n    display:inline-flex;align-items:center;justify-content:center;gap:6px;\n    transition:transform .15s,opacity .15s;flex:none;\n  }\n  .btn:active{transform:scale(.96)}\n  .btn-red{background:var(--red);color:#fff}\n  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow-lg)}\n  .btn-ghost{background:#eef0f8;color:var(--ink-2)}\n  .btn-green{background:var(--green);color:#fff}\n  .all-done{\n    background:linear-gradient(135deg,#ecfdf5,#f0fdf4);border:1.5px solid #a7f3d0;\n    border-radius:var(--radius);padding:16px;text-align:center;color:#047857;font-weight:600;font-size:14px;\n  }\n\n  /* ---------- Goal rows (today) ---------- */\n  .goal-row{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;transition:border-color .2s,background .2s}\n  .goal-row.done{background:#f0fdf9;border-color:#a7f3d0}\n  .goal-row.overdue{border-color:#fecaca}\n  .goal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}\n  .goal-color-dot{width:12px;height:12px;border-radius:4px;flex:none}\n  .goal-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}\n  .badge-overdue{background:#fee2e2;color:var(--red)}\n  .badge-done{background:#d1fae5;color:#047857}\n  .badge-today{background:#e0e7ff;color:var(--brand)}\n  .mini-progress{height:8px;background:#eef0f6;border-radius:99px;overflow:hidden;margin-bottom:12px;box-shadow:inset 0 1px 2px rgba(28,35,51,.07)}\n  .mini-progress i{display:block;height:100%;border-radius:99px;transition:width .5s ease}\n  .checkin{display:flex;gap:8px;flex-wrap:wrap}\n  .checkin .field{flex:1;min-width:100px}\n  .checkin label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px;font-weight:600}\n  .checkin input,.checkin select{\n    width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;\n    background:#fafbff;outline:none;transition:border-color .15s;\n  }\n  .checkin input:focus,.checkin select:focus{border-color:var(--brand)}\n  .checkin .btn{align-self:flex-end}\n  .today-note{font-size:12px;color:#047857;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:5px}\n\n  /* ---------- Board ---------- */\n  .board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}\n  .goal-card{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:transform .2s ease,box-shadow .2s ease}\n  .ring-wrap{display:flex;gap:16px;align-items:center;margin-bottom:14px}\n  .ring{position:relative;width:96px;height:96px;flex:none}\n  .ring svg{transform:rotate(-90deg)}\n  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}\n  .ring .pct b{font-size:20px;line-height:1.1}\n  .ring .pct span{font-size:10px;color:var(--ink-3)}\n  .ring-stats{flex:1;min-width:0}\n  .stat-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}\n  .stat-line:last-child{flex-basis:100%;margin-bottom:0}\n  .stat-line b{color:var(--ink)}\n  .stat-line svg{flex:none}\n  .eta-ahead{color:var(--green);font-weight:700}\n  .eta-behind{color:var(--red);font-weight:700}\n  .streak-flame{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#f97316}\n  .recent-logs{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}\n  .recent-logs .log-item{display:flex;align-items:center;font-size:12px;color:var(--ink-2);padding:3px 0;gap:6px}\n  .recent-logs .log-item .del{margin-left:auto;color:var(--ink-3);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}\n  .recent-logs .log-item .del:active{background:#fee2e2;color:var(--red)}\n  .recent-logs .log-item .del.confirming{width:auto;padding:0 8px;background:var(--red);color:#fff;font-weight:600}\n  .badge-makeup{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:#eef0f6;color:var(--ink-3);flex:none}\n  .toggle-logs{font-size:12px;color:var(--brand);font-weight:600;padding:6px 0;min-height:32px}\n\n  /* ---------- Chart ---------- */\n  .chart-scroll{overflow-x:auto}\n  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}\n  .legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}\n  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}\n\n  /* ---------- Goals manage ---------- */\n  .manage-row{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}\n  .manage-row .info{flex:1;min-width:0}\n  .manage-row .info b{display:block;font-size:14px}\n  .icon-btn{\n    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;\n    color:var(--ink-2);background:#f4f5fa;flex:none;transition:all .15s;font-size:13px;font-weight:600;\n  }\n  .icon-btn:active{transform:scale(.94)}\n  .icon-btn.danger.confirming{background:var(--red);color:#fff;width:auto;padding:0 14px}\n  .fab-add{width:100%;min-height:52px;border:2px dashed #c7cbf0;border-radius:14px;color:var(--brand);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fafbff}\n\n  /* ---------- Modal ---------- */\n  .modal-mask{position:fixed;inset:0;background:rgba(20,24,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}\n  .modal-mask.show{display:flex}\n  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:slideUp .28s ease;max-height:88vh;overflow-y:auto}\n  @media(min-width:640px){.modal-mask{align-items:center;padding:20px}.modal{border-radius:20px;max-width:560px;box-shadow:0 24px 80px -12px rgba(20,24,40,.35)}}\n  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}\n  .modal h3{font-size:17px;font-weight:800;margin-bottom:16px}\n  .form-row{margin-bottom:14px}\n  .form-row label,.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}\n  .form-row input,.form-row select{\n    width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fafbff;outline:none;\n  }\n  .form-row input:focus{border-color:var(--brand)}\n  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  .color-pick{display:flex;gap:10px;flex-wrap:wrap}\n  .color-pick button{width:44px;height:44px;border-radius:12px;border:3px solid transparent;transition:all .15s}\n  .color-pick button.sel{border-color:var(--ink);transform:scale(1.08)}\n  .modal-actions{display:flex;gap:10px;margin-top:18px}\n  .modal-actions .btn{flex:1;min-height:50px}\n\n  /* ---------- Weekly ---------- */\n  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}\n  .week-nav .btn{flex:none}\n  .week-nav .label{flex:1;text-align:center;font-weight:700;font-size:14px}\n  .week-summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}\n  .week-summary-row:last-child{border-bottom:none}\n  .week-summary-row .vals{text-align:right;font-size:13px;color:var(--ink-2)}\n  .week-summary-row .vals b{color:var(--ink)}\n  .week-compare{font-size:11px;color:var(--ink-3);margin-top:2px}\n  .kpt-row{margin-bottom:12px}\n  .kpt-row label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}\n  .kpt-row label .hint{font-weight:400;color:var(--ink-3);font-size:12px}\n  .kpt-row input{\n    width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fafbff;outline:none;\n  }\n  .kpt-row input:focus{border-color:var(--brand)}\n  textarea{\n    width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:12px;\n    background:#fafbff;outline:none;resize:vertical;line-height:1.5;\n  }\n  textarea:focus{border-color:var(--brand)}\n  .report-preview{\n    background:#1c2333;color:#d5dbea;border-radius:12px;padding:16px;font-size:13px;line-height:1.8;\n    white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:12px;\n  }\n\n  /* ---------- Footer ---------- */\n  .footer{max-width:960px;margin:0 auto;padding:0 20px 40px;text-align:center}\n  .footer .danger-zone{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}\n  .footer .tiny{margin-top:12px}\n\n  /* ---------- Toast ---------- */\n  .toast{\n    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);opacity:0;\n    background:#1c2333;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;\n    z-index:99;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center;\n  }\n  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}\n\n  /* ---------- Confetti ---------- */\n  .confetti-bit{position:fixed;top:-12px;z-index:98;border-radius:2px;pointer-events:none;animation:confetti-fall linear forwards}\n  @keyframes confetti-fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}\n\n  /* ---------- Empty ---------- */\n  .empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:14px}\n\n  @media(prefers-reduced-motion:reduce){\n    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}\n  }\n\n  /* ---------- 概览统计条 ---------- */\n  .stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}\n  .stat-card{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:11px;min-width:0;transition:transform .2s,box-shadow .2s}\n  .stat-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}\n  .stat-ico svg{width:18px;height:18px}\n  .stat-text{display:flex;flex-direction:column;min-width:0}\n  .stat-num{font-size:19px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}\n  .stat-lbl{font-size:12px;color:var(--ink-2);white-space:nowrap}\n  @media(min-width:768px){.stat-strip{grid-template-columns:repeat(4,1fr)}}\n\n  /* ---------- 今日已打卡分区 ---------- */\n  .done-sec{margin-top:18px}\n  .done-sec-title{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;color:var(--green);margin-bottom:10px}\n  .done-sec-title .cnt{background:#e8f6f0;color:var(--green);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}\n\n  /* ---------- 本周打卡节奏 ---------- */\n  .rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}\n  .rhythm-day{text-align:center;padding:8px 2px;border-radius:10px;background:#f7f8fc;transition:background .2s}\n  .rhythm-day .dl{font-size:11px;color:var(--ink-3)}\n  .rhythm-day .dd{font-size:15px;font-weight:800;margin-top:1px;line-height:1.35;color:var(--ink-3)}\n  .rhythm-day .dm{font-size:10.5px;color:var(--ink-3);min-height:14px}\n  .rhythm-day.hit{background:#eef0ff}\n  .rhythm-day.hit .dd{color:var(--brand)}\n  .rhythm-day.today{outline:2px solid rgba(99,102,241,.45);outline-offset:-2px}\n  .rhythm-day.future{opacity:.45}\n\n  /* ---------- 看板底部：打卡热力 + 最近动态 ---------- */\n  .board-bottom{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;align-items:start}\n  @media(min-width:1024px){.board-bottom{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.board-bottom .card{margin-bottom:0}}\n  .heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--ink-3);text-align:center;margin-bottom:3px}\n  .heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}\n  .heat-cell{height:14px;border-radius:4px;background:#eef0f6}\n  .heat-cell.l1{background:rgba(99,102,241,.22)}\n  .heat-cell.l2{background:rgba(99,102,241,.45)}\n  .heat-cell.l3{background:rgba(99,102,241,.72)}\n  .heat-cell.l4{background:#6366f1}\n  .heat-cell. /* ================= 工具 ================= */
var LS_KEY = "goal_workspace_v1";
var LEGACY_KEYS = ["learning-goal-tracker-v1"];
var BROKEN_KEY = "goal_workspace_v1_broken";
var COLORS = ["#6366f1","#f59e0b","#10b981","#0ea5e9","#8b5cf6","#ef4444","#f97316","#14b8a6"];
/* 内置演示数据的目标 id（用于旧演示内容升级时清理；与用户自建目标区分） */
var SEED_IDS = ["seed-g1","seed-g2","seed-g3","seed-g4","seed-g5","seed-g6"];
var SEED_VERSION = 3;
var bootNotice = "";

function pad(n){ return (n<10?"0":"")+n; }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseDate(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(s,n){ var d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function diffDays(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); } /* b - a */
function fmtShort(s){ var p=s.split("-"); return (+p[1])+"/"+(+p[2]); }
function trimNum(n){
  if(Math.abs(n-Math.round(n))<1e-9) return String(Math.round(n));
  return (Math.round(n*10)/10).toString();
}
function uid(){ return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function mondayOf(dateStr){
  var d=parseDate(dateStr); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return fmtDate(d);
}

/* ================= 数据 ================= */
var state = null;

function blankState(){
  return { version:2, seedVersion:SEED_VERSION, goals:[], logs:[], notes:{}, seeded:false, backupDismissedAt:null, createdAt:todayStr() };
}

function isDateString(v){
  if(typeof v!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  var d=parseDate(v);
  return !isNaN(d.getTime()) && fmtDate(d)===v;
}
function finiteNumber(v,min,max){ return typeof v==="number" && Number.isFinite(v) && v>=min && v<=max; }
function cleanText(v,max){ return typeof v==="string" ? v.trim().slice(0,max) : ""; }

/* v1 → v2 迁移，并兼容早期字段名 */
function migrate(data){
  data=data||state;
  if(!Array.isArray(data.goals)) data.goals=[];
  if(!Array.isArray(data.logs)) data.logs=[];
  if(!data.notes || typeof data.notes!=="object" || Array.isArray(data.notes)) data.notes={};
  data.goals.forEach(function(g){
    if(typeof g.obstacle!=="string") g.obstacle="";
    if(typeof g.plan!=="string") g.plan="";
    if(g.sample===true && SEED_IDS.indexOf(g.id)<0) SEED_IDS.push(g.id);
  });
  data.logs.forEach(function(l){ if(!l.date && l.d) l.date=l.d; delete l.d; });
  var nn={};
  for(var k in data.notes){
    var v=data.notes[k];
    nn[k]=(typeof v==="string") ? {keep:v,problem:"",try:"",next:""} : v;
  }
  data.notes=nn;
  if(data.meta && typeof data.meta==="object"){
    if(data.seeded==null) data.seeded=!!data.meta.installedSample;
    if(data.backupDismissedAt==null && finiteNumber(data.meta.backupRemindedAt,0,1000000)) data.backupDismissedAt=data.meta.backupRemindedAt;
  }
  if(typeof data.seeded!=="boolean") data.seeded=false;
  if(typeof data.seedVersion!=="number") data.seedVersion=1;
  if(data.backupDismissedAt!=null && !finiteNumber(data.backupDismissedAt,0,1000000)) data.backupDismissedAt=null;
  if(!isDateString(data.createdAt)) data.createdAt=todayStr();
  data.version=2;
  delete data.exportedAt;
  return data;
}

function validateState(input){
  var data=migrate(input);
  if(data.goals.length>500 || data.logs.length>100000) throw new Error("数据条数超出支持范围");
  var goalIds={};
  data.goals.forEach(function(g){
    if(!g || typeof g!=="object") throw new Error("目标数据损坏");
    if(typeof g.id!=="string" || !/^[A-Za-z0-9_-]{1,80}$/.test(g.id) || goalIds[g.id]) throw new Error("目标 ID 无效或重复");
    goalIds[g.id]=1;
    g.name=cleanText(g.name,30); g.unit=cleanText(g.unit,6)||"个";
    g.obstacle=cleanText(g.obstacle,60); g.plan=cleanText(g.plan,60);
    if(!g.name || !finiteNumber(g.total,0.000000001,1000000000000)) throw new Error("目标名称或总量无效");
    if(!isDateString(g.deadline) || !isDateString(g.createdAt)) throw new Error("目标日期无效");
    if(typeof g.color==="string") g.color=g.color.toLowerCase();
    if(COLORS.indexOf(g.color)<0) throw new Error("目标配色无效");
  });
  var logIds={};
  data.logs.forEach(function(l){
    if(!l || typeof l!=="object") throw new Error("打卡记录损坏");
    if(typeof l.id!=="string" || !/^[A-Za-z0-9_-]{1,80}$/.test(l.id) || logIds[l.id]) throw new Error("记录 ID 无效或重复");
    logIds[l.id]=1;
    if(!goalIds[l.goalId] || !isDateString(l.date)) throw new Error("记录关联或日期无效");
    if(!finiteNumber(l.amount,0.000000001,1000000000000)) throw new Error("记录完成量无效");
    if(l.minutes!=null && !finiteNumber(l.minutes,0,1440)) throw new Error("记录用时无效");
    if(l.ts!=null && !finiteNumber(l.ts,0,9007199254740991)) l.ts=Date.now();
    l.makeup=!!l.makeup;
  });
  var cleanNotes={};
  Object.keys(data.notes).forEach(function(k){
    if(!isDateString(k)) return;
    var n=data.notes[k]||{};
    cleanNotes[k]={keep:cleanText(n.keep,100),problem:cleanText(n.problem,100),try:cleanText(n.try,100),next:cleanText(n.next,100)};
  });
  data.notes=cleanNotes;
  return data;
}

function save(silent){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    if(!silent) toast("数据未能写入，请检查存储空间");
    return false;
  }
}

function load(){
  var raw=null, sourceKey=LS_KEY;
  try{
    raw=localStorage.getItem(LS_KEY);
    if(!raw){
      for(var i=0;i<LEGACY_KEYS.length;i++){
        raw=localStorage.getItem(LEGACY_KEYS[i]);
        if(raw){ sourceKey=LEGACY_KEYS[i]; break; }
      }
    }
    if(raw){
      state=validateState(JSON.parse(raw));
      var upgraded=false;
      /* 旧版内置演示数据（seedVersion 落后）自动升级为新演示内容，用户自建目标与记录保留 */
      if(state.seeded===true && state.seedVersion < SEED_VERSION){
        state.goals=state.goals.filter(function(g){ return SEED_IDS.indexOf(g.id)<0; });
        state.logs=state.logs.filter(function(l){ return SEED_IDS.indexOf(l.goalId)<0; });
        seed(); state.seedVersion=SEED_VERSION; upgraded=true;
      }
      if(save(true)){
        if(sourceKey!==LS_KEY) bootNotice="已自动迁移旧版数据";
        else if(upgraded) bootNotice="内置内容已更新";
      }
      return;
    }
  }catch(e){
    if(raw){
      try{ localStorage.setItem(BROKEN_KEY,raw); }catch(ignore){}
      bootNotice="检测到异常数据，已保留原始副本并载入内置内容";
    }else{
      bootNotice="浏览器存储不可用，本次修改可能无法保留";
    }
  }
  state=blankState();
  seed();
  save(true);
}

function seed(){
  /* 内置演示内容：模拟已使用约一个半月的状态（目标 + 打卡记录 + 周报复盘）。
     首次打开自动载入；与用户自建数据无异，可任意编辑、删除。 */
  var t = todayStr(), now = Date.now(), L = [];
  function log(g,d,a,m,mk){
    var o={ id:uid(), goalId:g, date:addDays(t,d), amount:a, minutes:m||null, ts:now+d*86400000 };
    if(mk) o.makeup=true;
    L.push(o);
  }
  /* 若存在旧版演示目标，先移除（用户自建目标保留） */
  state.goals = state.goals.filter(function(g){ return SEED_IDS.indexOf(g.id)<0; });
  state.logs = state.logs.filter(function(l){ return SEED_IDS.indexOf(l.goalId)<0; });

  /* g1 背英语单词：近 25 天全勤 → 长 streak；节奏好 → 预计提前完成 */
  state.goals.push({ id:"seed-g1", name:"背英语单词", unit:"个", total:2500, deadline:addDays(t,50), color:COLORS[0], createdAt:addDays(t,-31), obstacle:"今天状态差，一个都不想背", plan:"先只背 10 个，打开就算赢" });
  for(var i=-31;i<=-1;i++){
    if(i>=-25 || Math.abs(i)%2===0){
      log("seed-g1", i, 45+Math.abs(i)*7%20, 30+Math.abs(i)*13%15, i===-2);
    }
  }
  /* g2 读完《人类简史》：均速偏低 → 预计拖后；本周两次漏打 → 休息日 + 红卡演示 */
  state.goals.push({ id:"seed-g2", name:"读完《人类简史》", unit:"页", total:440, deadline:addDays(t,20), color:COLORS[1], createdAt:addDays(t,-31), obstacle:"睡前一躺下就想刷手机", plan:"把书放在枕头上，先读 2 页再看手机" });
  for(i=-31;i<=-6;i++){
    var m2=Math.abs(i)%7;
    if(m2===0 || m2===3) log("seed-g2", i, 14+Math.abs(i)%9, 30+Math.abs(i)*7%20);
  }
  log("seed-g2",-5,20,35);   /* 周一 */
  /* 周二漏 → 本周休息日，连续天数保住 */
  log("seed-g2",-3,12,30);   /* 周三 */
  log("seed-g2",-2,15,32);   /* 周四 */
  /* 周五又漏 → 红卡，滚入今日处理 */

  /* g3 Python 入门课：节奏中等，最近一周全勤 */

/* ================= 计算 ================= */
function goalById(id){ for(var i=0;i<state.goals.length;i++) if(state.goals[i].id===id) return state.goals[i]; return null; }
function doneAmount(gid){
  var s=0; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid) s+=state.logs[i].amount; return s;
}
function logsOn(gid,dateStr){
  var s=0; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid && state.logs[i].date===dateStr) s+=state.logs[i].amount; return s;
}
function minutesOn(gid,dateStr){
  var s=0; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid && state.logs[i].date===dateStr && state.logs[i].minutes) s+=state.logs[i].minutes; return s;
}
function hasLogOn(gid,dateStr){
  for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid && state.logs[i].date===dateStr) return true; return false;
}
function dateSetOf(gid){
  var s={}; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid) s[state.logs[i].date]=1; return s;
}
/* 休息日判定：d 无记录，且 d 所在周周一（不早于创建日）至 d-1 无更早漏打日 → d 是本周首个漏打日，自动成为休息日 */
function isRestDay(gid, d, dates){
  var g=goalById(gid); if(!g) return false;
  var mon=mondayOf(d);
  var start = mon < g.createdAt ? g.createdAt : mon;
  var cur=start;
  while(cur<d){
    if(!dates[cur]) return false;
    cur=addDays(cur,1);
  }
  return true;
}
function streak(gid){
  var g=goalById(gid); if(!g) return 0;
  var dates=dateSetOf(gid);
  var d=todayStr();
  if(!dates[d]) d=addDays(d,-1);
  var s=0;
  while(d>=g.createdAt){
    if(dates[d]){ s++; d=addDays(d,-1); continue; }
    if(isRestDay(gid,d,dates)){ d=addDays(d,-1); continue; }
    break;
  }
  return s;
}
/* 近 7 天总投入（含今天，共 7 个自然日） */
function last7Sum(gid){
  var t=todayStr(), from=addDays(t,-6), s=0;
  for(var i=0;i<state.logs.length;i++){
    var l=state.logs[i];
    if(l.goalId===gid && l.date>=from && l.date<=t) s+=l.amount;
  }
  return s;
}
/* 预计完成日：null=样本不足 */
function eta(g){
  var done=doneAmount(g.id), remain=g.total-done;
  if(remain<=0) return { status:"done" };
  var speed=last7Sum(g.id)/7;
  if(speed<=0) return { status:"unknown" };
  var days=Math.ceil(remain/speed);
  var etaDate=addDays(todayStr(),days);
  var diff=diffDays(etaDate,g.deadline); /* 截止-预计：正则提前 */
  return { status:"ok", date:etaDate, diff:diff };
}
function dailySuggest(g){
  var remain=g.total-doneAmount(g.id);
  if(remain<=0) return 0;
  var daysLeft=diffDays(todayStr(),g.deadline);
  if(daysLeft<0) return remain; /* 已逾期：建议一次补完 */
  return Math.ceil(remain/Math.max(1,daysLeft+1)*10)/10;
}
function isComplete(g){ return doneAmount(g.id)>=g.total; }
function isOverdue(g){ return !isComplete(g) && diffDays(todayStr(),g.deadline)<0; }
function missedYesterday(g){
  if(isComplete(g) || hasLogOn(g.id,todayStr())) return false;
  if(g.createdAt>addDays(todayStr(),-1)) return false;
  return !hasLogOn(g.id, addDays(todayStr(),-1));
}

/* ================= 14 天投入时长图：统一使用分钟，避免跨单位相加 ================= */
function renderChart(){
  var days=[], i, t=todayStr();
  for(i=13;i>=0;i--) days.push(addDays(t,-i));
  var data={}, max=0, usedGoals={};
  days.forEach(function(d){
    data[d]={}; var sum=0;
    state.goals.forEach(function(g){
      var v=minutesOn(g.id,d);
      if(v>0){ data[d][g.id]=v; sum+=v; usedGoals[g.id]=1; }
    });
    if(sum>max) max=sum;
  });
  if(max===0){ $("chartBox").innerHTML='<div class="empty">近 14 天暂无用时记录；打卡时填写分钟数后会显示趋势</div>'; $("chartLegend").innerHTML=''; return; }

  var W=680,H=210,padL=42,padB=26,padT=10,plotW=W-padL-8,plotH=H-padT-padB;
  var bw=Math.min(26, plotW/14*0.55), gap=plotW/14;
  var step=Math.max(1,max/4), mag=Math.pow(10,Math.floor(Math.log10(step)));
  var yMax=Math.ceil(max/4/mag)*mag*4; if(yMax<=0)yMax=max;

  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:520px;display:block" role="img" aria-label="近 14 天各目标投入分钟数堆叠图">';
  for(i=0;i<=4;i++){
    var v=yMax*i/4, y=padT+plotH-(v/yMax)*plotH;
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#eef0f6" stroke-width="1"/>'+
         '<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#6b7280">'+trimNum(v)+'分</text>';
  }
  days.forEach(function(d,idx){
    var x=padL+gap*idx+(gap-bw)/2, cursor=padT+plotH;
    state.goals.forEach(function(g){
      var v=data[d][g.id]; if(!v)return;
      var h=(v/yMax)*plotH; cursor-=h;
      svg+='<rect x="'+x.toFixed(1)+'" y="'+cursor.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" fill="'+g.color+'" rx="2"><title>'+esc(g.name)+' '+fmtShort(d)+' · '+trimNum(v)+' 分钟</title></rect>';
    });
    if(idx%2===0||idx===13) svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#6b7280">'+fmtShort(d)+'</text>';
  });
  svg+='</svg>';
  $("chartBox").innerHTML=svg;
  var lg='';
  state.goals.forEach(function(g){ if(usedGoals[g.id]) lg+='<span><i style="background:'+g.color+'"></i>'+esc(g.name)+'</span>'; });
  $("chartLegend").innerHTML=lg;
}

/* ================= 周报复盘 ================= */
var weekOffset=0; /* 0=本周 */
function currentWeekRange(){
  var mon=mondayOf(todayStr());
  var start=addDays(mon, weekOffset*7);
  return { start:start, end:addDays(start,6) };
}
/* 统计一段日期范围：perGoal {gid:{sum,days,mins}} 与合计分钟 */
function weekStats(start,end){
  var per={}, totalMin=0;
  state.goals.forEach(function(g){
    var sum=0, days={}, mins=0;
    state.logs.forEach(function(l){
      if(l.goalId===g.id && l.date>=start && l.date<=end){
        sum+=l.amount; days[l.date]=1; if(l.minutes) mins+=l.minutes;
      }
    });
    per[g.id]={ sum:sum, days:Object.keys(days).length, mins:mins };
    totalMin+=mins;
  });
  return { per:per, totalMin:totalMin };
}
function readNoteForm(){
  return {
    keep:$("noteKeep").value.trim(),
    problem:$("noteProblem").value.trim(),
    try:$("noteTry").value.trim(),
    next:$("noteNext").value.trim()
  };
}
function renderWeekly(){
  var r=currentWeekRange();
  var isCur=weekOffset===0;
  $("weekLabel").textContent=fmtShort(r.start)+" - "+fmtShort(r.end)+(isCur?"（本周）":"");
  $("weekNext").style.visibility = weekOffset<0 ? "visible":"hidden";

  var cur=weekStats(r.start,r.end);
  var prev=weekStats(addDays(r.start,-7), addDays(r.start,-1));
  var html='', any=false;
  state.goals.forEach(function(g){
    var c=cur.per[g.id], p=prev.per[g.id];
    if(c.sum>0||c.days>0) any=true;
    /* 已完成且本周无投入的目标不占行，避免周报随历史完成数累积 */
    if(isComplete(g) && c.days===0) return;
    var cmp='';
    if(p.sum>0||p.days>0){
      cmp='<div class="week-compare">上周 '+(p.sum>0?'+'+trimNum(p.sum)+' '+esc(g.unit)+' · ':'')+'打卡 '+p.days+' 天'+(p.mins>0?' · '+p.mins+' 分钟':'')+'</div>';
    }
    html+='<div class="week-summary-row">'+
      '<span><span class="goal-color-dot" style="background:'+g.color+';display:inline-block;margin-right:6px;vertical-align:-1px"></span>'+esc(g.name)+'</span>'+
      '<span class="vals">'+(c.sum>0?'<b class="num">+'+trimNum(c.sum)+'</b> '+esc(g.unit)+' · ':'')+'打卡 <b class="num">'+c.days+'</b> 天'+(c.mins>0?' · <span class="num">'+c.mins+'</span> 分钟':'')+cmp+'</span>'+
    '</div>';
  });
  if(!any) html='<div class="empty" style="padding:20px">这一周还没有打卡记录</div>';
  else{
    var minCmp='';
    if(prev.totalMin>0){
      var dm=cur.totalMin-prev.totalMin;
      minCmp='<div class="week-compare">上周 '+prev.totalMin+' 分钟'+(dm!==0?'（较上周 '+(dm>0?'+':'')+dm+'）':'')+'</div>';
    }
    html+='<div class="week-summary-row" style="border-top:1px solid var(--line);margin-top:4px"><b>合计投入</b><span class="vals"><b class="num">'+cur.totalMin+'</b> 分钟'+minCmp+'</span></div>';
  }
  $("weekSummary").innerHTML=html;

  var wk=r.start, n=state.notes[wk]||{};
  $("noteKeep").value=n.keep||"";
  $("noteProblem").value=n.problem||"";
  $("noteTry").value=n.try||"";
  $("noteNext").value=n.next||"";
  $("reportBox").style.display="none";
}

function buildReportText(){
  var r=currentWeekRange();
  var cur=weekStats(r.start,r.end);
  var prev=weekStats(addDays(r.start,-7), addDays(r.start,-1));
  var lines=["【学习周报】"+fmtShort(r.start)+" - "+fmtShort(r.end)];
  state.goals.forEach(function(g){
    var c=cur.per[g.id], p=prev.per[g.id];
    if(c.sum>0||c.days>0){
      var pct=Math.min(100,Math.round(doneAmount(g.id)/g.total*100));
      var line="- "+g.name+"：+"+trimNum(c.sum)+" "+g.unit+"，打卡 "+c.days+" 天（累计 "+pct+"%）";
      if(p.sum>0) line+="｜上周 +"+trimNum(p.sum)+" "+g.unit;
      lines.push(line);
    }
  });
  if(cur.totalMin>0){
    var mline="本周总投入："+cur.totalMin+" 分钟";
    if(prev.totalMin>0) mline+="（上周 "+prev.totalMin+" 分钟）";
    lines.push(mline);
  }
  var n=state.notes[r.start]||{};
  if(n.keep) lines.push("保持："+n.keep);
  if(n.problem) lines.push("问题："+n.problem);
  if(n.try) lines.push("尝试："+n.try);
  if(n.next) lines.push("下周预案："+n.next);
  return lines.join("\n");
}

function copyText(text, okMsg){
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(okMsg); }catch(e){ toast("复制失败，请手动选择复制"); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  }else fallback();
}

/* ================= 打卡 & 庆祝 ================= */
function doCheckin(gid){
  var g=goalById(gid); if(!g) return;
  var amtEl=$("amt-"+gid), minEl=$("min-"+gid), dateEl=$("date-"+gid);
  var amt=Number(amtEl.value);
  if(!finiteNumber(amt,0.000000001,1000000000000)){ toast("完成数量需为有效正数"); amtEl.focus(); return; }
  var mins=minEl&&minEl.value!==""?Number(minEl.value):null;
  if(mins!=null && !finiteNumber(mins,0,1440)){ toast("用时需为 0–1440 分钟"); minEl.focus(); return; }
  var date=(dateEl&&dateEl.value)?dateEl.value:todayStr();
  if(date<addDays(todayStr(),-6) || date>todayStr()) date=todayStr();
  var makeup = date<todayStr();
  var wasComplete=isComplete(g);
  var rec={ id:uid(), goalId:gid, date:date, amount:amt, minutes:mins, ts:Date.now() };
  if(makeup) rec.makeup=true;
  state.logs.push(rec);
  pushRemote(rec, g);
  save(); render();
  if(!wasComplete && isComplete(g)){
    celebrate();
    toast("目标「"+g.name+"」达成，恭喜！");
  }else if(makeup){
    toast("已补记 "+fmtShort(date)+"：+"+trimNum(amt)+" "+g.unit);
  }else{
    toast("已打卡 +"+trimNum(amt)+" "+g.unit);
  }
}

function celebrate(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var colors=COLORS.concat(["#fbbf24","#34d399"]);
  for(var i=0;i<70;i++){
    var b=document.createElement("div");
    b.className="confetti-bit";
    var size=6+Math.random()*8;
    b.style.left=(Math.random()*100)+"vw";
    b.style.width=size+"px"; b.style.height=(size*0.5)+"px";
    b.style.background=colors[i%colors.length];
    b.style.animationDuration=(1.4+Math.random()*1.4)+"s";
    b.style.animationDelay=(Math.random()*0.4)+"s";
    document.body.appendChild(b);
    (function(el){ setTimeout(function(){ el.remove(); },3200); })(b);
  }
}

/* ================= 清空 ================= */
/* 两步确认按钮（防误触） */
function armConfirm(btn, label, action){
  if(btn.dataset.armed==="1"){ btn.dataset.armed=""; action(); return; }
  btn.dataset.armed="1";
  var old=btn.innerHTML;
  btn.innerHTML=label;
  btn.classList.add("confirming");
  if(btn.classList.contains("btn")) btn.style.background="var(--red)", btn.style.color="#fff";
  setTimeout(function(){ if(btn.dataset.armed){ btn.dataset.armed=""; btn.innerHTML=old; btn.classList.remove("confirming"); btn.style.background=""; btn.style.color=""; } },3000);
}

/* ================= 事件 ================= */
function switchTab(name,focusTab){
  root.querySelectorAll(".nav button").forEach(function(x){
    var on=x.dataset.tab===name;
    x.classList.toggle("active",on);
    x.setAttribute("aria-selected",on?"true":"false");
    x.tabIndex=on?0:-1;
    if(on && focusTab) x.focus();
  });
  root.querySelectorAll(".tab-panel").forEach(function(p){
    var on=p.id==="panel-"+name;
    p.classList.toggle("active",on);
    p.setAttribute("aria-hidden",on?"false":"true");
  });
}
function bind(){
  /* Tab 切换 */
  var tabs=Array.prototype.slice.call(root.querySelectorAll(".nav button"));
  tabs.forEach(function(b,idx){
    b.addEventListener("click",function(){ switchTab(b.dataset.tab); });
    b.addEventListener("keydown",function(e){
      if(e.key!=="ArrowRight" && e.key!=="ArrowLeft" && e.key!=="Home" && e.key!=="End") return;
      e.preventDefault();
      var next=e.key==="Home"?0:e.key==="End"?tabs.length-1:(idx+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
      switchTab(tabs[next].dataset.tab,true);
    });
  });

  /* 侧边栏新建目标（PC） */
  var sideAddBtn=$("btnSideAdd");
  if(sideAddBtn) sideAddBtn.addEventListener("click",function(){ openGoalModal(null); });

  /* 主区域事件代理 */
  root.querySelector("main").addEventListener("click",function(e){
    var t=e.target.closest("[data-checkin]");
    if(t){ doCheckin(t.dataset.checkin); return; }
    t=e.target.closest("[data-addgoal]");
    if(t){ openGoalModal(null); return; }
    t=e.target.closest("[data-goto]");
    if(t){ switchTab(t.dataset.goto); return; }
    t=e.target.closest("[data-togglelogs]");
    if(t){ var g=t.dataset.togglelogs; logsExpanded[g]=!logsExpanded[g]; renderBoard(); return; }
    t=e.target.closest("[data-dellog]");
    if(t){
      var id=t.dataset.dellog;
      armConfirm(t,"确认？",function(){
        state.logs=state.logs.filter(function(l){return l.id!==id;});
        save(); render(); toast("已删除该条记录");
      });
      return;
    }
    t=e.target.closest("[data-edit]");
    if(t){ openGoalModal(goalById(t.dataset.edit)); return; }
    t=e.target.closest("[data-del]");
    if(t){
      var gid=t.dataset.del;
      armConfirm(t,"确认删除？",function(){
        var g=goalById(gid);
        state.goals=state.goals.filter(function(x){return x.id!==gid;});
        state.logs=state.logs.filter(function(l){return l.goalId!==gid;});
        save(); render(); toast("已删除「"+(g?g.name:"")+"」及其全部记录");
      });
      return;
    }
    /* 我的：清空全部 */
    t=e.target.closest("#btnClearAll");
    if(t){

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function parseISO(s){const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);}
function addDays(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}
function mondayOf(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()-((t.getDay()+6)%7));return t;}
function themeHex(n){const t=THEMES.find(x=>x[0]===n);return t?t[1]:THEMES[0][1];}
function rgba(hex,a){
  const h=hex.replace('#','');
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')';
}
function mixInk(hex,w){
  const h=hex.replace('#','');
  const rgb=(getComputedStyle(document.documentElement).getPropertyValue('--ink-rgb')||'31,29,26').split(',').map(Number);
  const c=[0,1,2].map(i=>Math.round(parseInt(h.slice(i*2,i*2+2),16)*w+ (rgb[i]||0)*(1-w)));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
function applyTheme(el,name){
  const hex=themeHex(name);

  el.style.setProperty('--tint-06',rgba(hex,.06));

  el.style.setProperty('--tint-20',rgba(hex,.2));
  el.style.setProperty('--tint-45',rgba(hex,.45));
  el.style.setProperty('--theme-deep',mixInk(hex,.62));
}
function newBlocks(type){

/* ================= 记录计算 ================= */
function streak(id){
  const logs=state.logs[id]||{};
  let t=iso(new Date());
  if(!logs[t])t=addDays(t,-1); /* 今天还没做不算断 */
  let n=0;
  while(logs[t]){n++;t=addDays(t,-1);}
  return n;
}
function weekChecked(id){
  const logs=state.logs[id]||{},mon=mondayOf(new Date());
  let n=0;
  for(let i=0;i<7;i++){
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    if(logs[iso(d)])n++;
  }
  return n;
}
function statusLine(c){
  const logs=state.logs[c.id]||{};
  if(!Object.keys(logs).length)return '还没开始';
  /* 养成讲「连续」，戒除讲「守住」；未开始都是「还没开始」 */
  return (c.type==='quit'?'守住 ':'连续 ')+streak(c.id)+' 天 · 本周 '+weekChecked(c.id)+'/7';
}
/* 本周漏卡：只数今天之前已结束的日子，今天没打卡不算漏 */
function missInfo(id){
  const logs=state.logs[id]||{},now=new Date();
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const mon=mondayOf(now);
  let missed=0,checked=0;
  for(let i=0;i<7;i++){
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),k=iso(d);
    if(logs[k])checked++;
    if(d.getTime()<t0.getTime()&&!logs[k])missed++;
  }
  if(missed===0){
    if(checked===0)return{missed:0,msg:'新的一周，从今天的第一次打卡开始。'};
    return{missed:0,msg:'本周 '+checked+' 天全守住。连续数只是显示，不是目标。'};
  }
  if(missed===1)return{missed:1,msg:'本周漏了 1 次。继续数，不归零——但下一次别再漏。'};
  return{missed:missed,msg:'本周已漏 '+missed+' 次。不超两次——现在该改卡了，不是骂自己的时候。'};
}

function renumberCards(cards){
  ['build','quit'].forEach(t=>{

function normalize(d){
  const s={cards:[],logs:{},notes:{}};
  (Array.isArray(d.cards)?d.cards:[]).forEach((c,i)=>{
    if(!c||typeof c!=='object')return;
    const type=c.type==='quit'?'quit':'build';
    let blocks=newBlocks(type);
    if(Array.isArray(c.blocks)&&c.blocks.length){
      const mapped=c.blocks.map(b=>({
        n:String((b&&b.n)||''),
        title:String((b&&b.title)||''),
        rows:(b&&Array.isArray(b.rows)?b.rows:[]).map(r=>({
          tag:String((r&&r.tag)||''),text:String((r&&r.text!=null)?r.text:''),ph:String((r&&r.ph!=null)?r.ph:'')
        }))
      }));
      if(mapped.length)blocks=mapped;
    }
    s.cards.push({
      id:String(c.id||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5))),
      type:type,no:i+1,
      theme:THEMES.some(t=>t[0]===c.theme)?c.theme:THEMES[i%10][0],
      title:String(c.title!=null?c.title:''),
      identity:String(c.identity!=null?c.identity:''),
      blocks:blocks,
      env:String(c.env!=null?c.env:''),
      diff:[0,1,2].indexOf(c.diff)>-1?c.diff:1,
      review:String(c.review!=null?c.review:'')
    });
  });
  Object.keys(d.logs||{}).forEach(k=>{
    const v=d.logs[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      const m={};
      Object.keys(v).forEach(dk=>{if(v[dk])m[String(dk)]=true;});
      if(Object.keys(m).length)s.logs[k]=m;
    }
  });
  Object.keys(d.notes||{}).forEach(k=>{
    if(typeof d.notes[k]==='string')s.notes[k]=d.notes[k];
  });
  renumberCards(s.cards);   /* 导入数据也按分区重排序号 */
  return s;
}
