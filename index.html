  }catch(e){ return {goals:[],logs:[]}; }
}
function refreshGoalsCard(){
  const cell=app.querySelector('.zcell[data-zone="goals"]');
  if(!cell)return;
  const q=k=>cell.querySelector('[data-gz="'+k+'"]');
  const s=goalStateLite(), t=iso(new Date());
  const doneBy={};
  (s.logs||[]).forEach(l=>{ doneBy[l.goalId]=(doneBy[l.goalId]||0)+Number(l.amount||0); });
  const active=(s.goals||[]).filter(g=>doneBy[g.id]<Number(g.total||0));
  const checked=active.filter(g=>(s.logs||[]).some(l=>l.goalId===g.id&&l.date===t)).length;
  q('count').textContent=(s.logs||[]).length+' 条';
  q('today').textContent=checked;
  q('active').textContent='/ '+active.length;
  q('extra').textContent='· 累计 '+(s.logs||[]).length+' 条';
  q('txt').textContent=!s.goals.length?'还没有目标':(active.length===0?'全部已完成':'进行中 '+active.length+' 个目标');
  q('btn').style.display=s.goals.length?'':'none';
}
/* 就地重算一张入口卡的状态（不重渲染整页） */
function refreshZone(type){
  const cell=app.querySelector('.zcell[data-zone="'+type+'"]');
  if(!cell)return;
  const q=k=>cell.querySelector('[data-z="'+k+'"]');
  const cards=zoneCards(type);
  const t=iso(new Date());
  const done=cards.filter(c=>(state.logs[c.id]||{})[t]).length;
  const total=cards.length;
  q('count').textContent=total+' 张';
  q('done').textContent=done;
  q('total').textContent='/ '+total;
  const qe=q('extra');
  if(total){
    const best=cards.reduce((s,c)=>Math.max(s,streak(c.id)),0);
    qe.textContent='· 最长'+(type==='quit'?'守住':'连续')+' '+best+' 天';
    qe.style.display='';
  }else qe.style.display='none';
  const qt=q('txt'),btn=q('btn');
  if(!total){qt.textContent='还没有卡';btn.style.display='none';}
  else{
    btn.style.display='';
    if(done===0)qt.textContent='今天还没开始';
    else if(done===total)qt.textContent='今天全打完了';
    else qt.textContent='还有 '+(total-done)+' 张没打卡';
  }
}
function toggleZonePanel(type,btn,cell){
  const panel=cell.querySelector('[data-z="panel"]');
  if(panel.classList.contains('open')){
    panel.style.maxHeight=panel.scrollHeight+'px';
    requestAnimationFrame(()=>{panel.style.maxHeight='0px';panel.classList.remove('open');});
    btn.textContent='打卡';
    return;
  }
  const t=iso(new Date());
  const items=zoneCards(type).filter(c=>!(state.logs[c.id]||{})[t]);
  const wrap=cell.querySelector('[data-z="items"]');
  if(!items.length){
    wrap.innerHTML='<div class="z-alldone">今天都打完了<button class="z-collapse" type="button">收起</button></div>';
  }else{
    wrap.innerHTML=items.map(c=>
      '<div class="z-item" data-id="'+esc(c.id)+'">'+
        '<span class="z-item-name">'+esc(c.title||'未命名习惯')+'</span>'+
        '<button class="z-ring" type="button" data-id="'+esc(c.id)+'" aria-label="打卡：'+esc(c.title||'未命名习惯')+'">✓</button>'+
      '</div>').join('');
  }
  panel.classList.add('open');
  panel.style.maxHeight=Math.min(220,panel.scrollHeight)+'px';   /* 超出内部滚动，不撑破卡 */
  btn.textContent='收起';
  wrap.onclick=e=>{
    const col=e.target.closest('.z-collapse');
    if(col){toggleZonePanel(type,btn,cell);return;}
    const ring=e.target.closest('.z-ring');
    if(!ring||ring.classList.contains('on'))return;
    const id=ring.dataset.id;
    const lg=state.logs[id]||(state.logs[id]={});
    lg[t]=true;save();                       /* 1. 乐观写入当天记录 */
    ring.classList.add('on');                /* 2. 120ms 内填充主题色并显示 ✓ */
    const item=ring.closest('.z-item');
    item.classList.add('did');               /*    文字 60% 透明 + 划线 */
    setTimeout(()=>{
      item.classList.add('gone');            /* 3. 整行收缩消失 */
      setTimeout(()=>{
        item.remove();
        refreshZone(type);                   /* 4. 状态数字与文案就地更新 */
        if(!wrap.querySelector('.z-item')){
          panel.style.maxHeight=panel.scrollHeight+'px';
          requestAnimationFrame(()=>{panel.style.maxHeight='0px';panel.classList.remove('open');});
          btn.textContent='打卡';
          const tip=cell.querySelector('[data-z="tip"]');   /* 5. 完成提示 */
          tip.classList.remove('show');void tip.offsetWidth;tip.classList.add('show');
        }
      },200);
    },200);
  };
}
function renderZone(type){
  const Z=ZONES[type];

    '<main class="grid" id="grid"></main>';
  document.getElementById('btnBack').addEventListener('click',()=>navigate('#/'));
  bindIO();
  const grid=document.getElementById('grid');
  const list=[...cards].sort((a,b)=>a.no-b.no);
  list.forEach((c,i)=>{
    const T=TPL[c.type];
    const no=pad2(Math.min(c.no,99));
    const title=c.title?c.title:'未命名习惯';
    const cell=document.createElement('div');

    applyTheme(cell,c.theme);
    cell.innerHTML=
      '<a class="card'+(c.type==='quit'?' is-quit':'')+'" data-id="'+esc(c.id)+'" href="#/card/'+esc(c.id)+'" aria-label="'+esc(title)+'，'+T.plain+'">'+

        '<div class="card-foot"><span class="card-status">'+statusLine(c)+'</span><span class="card-arrow" aria-hidden="true">↗</span></div>'+
      '</a>';
    grid.appendChild(cell);
    /* 光效退出三步，顺序不能变：读值 → 写变量 → 撤类 → 两帧后清变量。
       无 setTimeout：移开瞬间动画停在该帧亮度上，快速收干净，不跳不残留 */
    cell.addEventListener('pointerenter',()=>{
      cell.style.removeProperty('--go-b');
      cell.style.removeProperty('--go-c');
      cell.classList.add('is-hover');
    });
    cell.addEventListener('pointerleave',()=>{
      const b=getComputedStyle(cell,'::before').opacity;
      const c2=getComputedStyle(cell,'::after').opacity;
      cell.style.setProperty('--go-b',b);
      cell.style.setProperty('--go-c',c2);
      cell.classList.remove('is-hover');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        cell.style.removeProperty('--go-b');
        cell.style.removeProperty('--go-c');
      }));
    });
  });
  const addCell=document.createElement('div');
  addCell.className='cell';
  addCell.style.setProperty('--i',list.length);
  addCell.innerHTML='<button class="add-card" id="btnAdd"><span class="plus">＋</span><span class="add-txt">新建卡</span></button>';
  grid.appendChild(addCell);
  document.getElementById('btnAdd').addEventListener('click',()=>createCard(type));
  grid.addEventListener('click',e=>{
    const a=e.target.closest('a.card');
    if(!a)return;
    e.preventDefault();
    navigate(a.getAttribute('href'),a.dataset.id);   /* 卡片 → 详情标题 morph */
  });
}

function lawCard(c,b,bi){
  const T=TPL[c.type];
  const digit=(String(b.n).replace(/[^0-9]/g,''))||String(bi+1);   /* 圆内输出 1/2/3/4 */
  const rows=b.rows.map((r,ri)=>{
    const ph=r.ph||(T.blocks[bi]&&T.blocks[bi][2][ri]&&T.blocks[bi][2][ri][1])||'待填写';
    if(editing){
      return '<div class="law-row"><span class="law-tag">'+esc(r.tag)+'</span>'+
        '<textarea class="inline-ta row-ta" data-b="'+bi+'" data-r="'+ri+'" rows="1" placeholder="'+esc(ph)+'">'+esc(r.text)+'</textarea></div>';
    }
    const empty=!r.text;
    return '<div class="law-row"><span class="law-tag">'+esc(r.tag)+'</span>'+
      '<p class="law-text'+(empty?' is-empty':'')+'">'+esc(empty?ph:r.text)+'</p></div>';
  }).join('');
  const unfilled=b.rows.some(r=>!r.text);
  return '<div class="law" data-b="'+bi+'">'+
    '<div class="law-head"><span class="law-no">'+esc(digit)+'</span><span class="law-title">'+esc(b.title)+'</span></div>'+
    (unfilled?'<span class="law-dot" title="还有未填写的字段"></span>':'')+
    rows+
  '</div>';
}

function buildWeek(mask,c){
  const wrap=mask.querySelector('#pWeek');
  const logs=state.logs[c.id]||{},now=new Date();
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const mon=mondayOf(now);
  const wd=['一','二','三','四','五','六','日'];
  const mark=c.type==='build'?'✓':'守';
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    const k=iso(d);
    const future=d.getTime()>t0.getTime();
    const done=!!logs[k]&&!future;
    const today=d.getTime()===t0.getTime();
    html+='<div class="p-col">'+
      '<button class="p-cell'+(done?' done':'')+(today?' today':'')+(future?' future':'')+'" data-k="'+k+'"'+(future?' disabled':'')+' aria-label="'+k+(done?' 已打卡':'')+'">'+mark+'</button>'+
      '<span class="p-wd">'+wd[i]+'</span>'+
    '</div>';
  }
  wrap.innerHTML=html;
  wrap.querySelectorAll('.p-cell:not(.future)').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    const mm=state.logs[c.id]||(state.logs[c.id]={});
    const on=!mm[k];
    if(on)mm[k]=true;else delete mm[k];
    save();
    b.classList.toggle('done',on);           /* 立即切换视觉状态 */
    b.classList.remove('just');void b.offsetWidth;
    if(on)b.classList.add('just');           /* 缩放脉冲 */
    refreshPanel(mask,c,true);               /* 就地更新数字与提示条，不重建周格 */
  }));
}
function refreshPanel(mask,c,justNow){
  const el=mask.querySelector('#pStreak');
  const prev=Number(mask.dataset.streak||0);
  const now=streak(c.id);
  if(justNow&&now!==prev&&!matchMedia('(prefers-reduced-motion: reduce)').matches)rollNumber(el,prev,now,200);
  else el.textContent=now;
  mask.dataset.streak=String(now);
  const info=missInfo(c.id);
  const st=mask.querySelector('#pStatus');
  if(st.textContent!==info.msg){
    st.textContent=info.msg;
    st.classList.remove('flash');void st.offsetWidth;st.classList.add('flash');   /* 140ms 淡入 */
  }
  st.classList.toggle('bad',info.missed>=2);
}
/* 连续天数 200ms 滚动插值（tabular-nums 防抖动；rAF 被节流时兜底落到终值） */
function rollNumber(el,from,to,ms){
  if(from===to){el.textContent=to;return;}
  const t0=performance.now();
  let done=false;
  const fin=()=>{if(done)return;done=true;el.textContent=to;};
  const step=t=>{
    const p=Math.min(1,(t-t0)/ms);
    el.textContent=Math.round(from+(to-from)*p);
    if(p<1)requestAnimationFrame(step);else fin();
  };
  requestAnimationFrame(step);
  setTimeout(fin,ms+60);
}

  document.getElementById('btnBack').addEventListener('click',()=>navigate(guideFrom||'#/'));

/* ================= 导出图片（Canvas 2D 手绘，不依赖任何外部库） ================= */
function rrect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
/* 自实现换行：中文按字符，英文/数字按词，超长词硬切 */
function pWrap(ctx,text,maxW){
  const out=[];let cur='';let word='';
  const w=s=>ctx.measureText(s).width;
  const place=tok=>{
    if(!tok)return;
    if(cur&&w(cur+tok)>maxW){out.push(cur);cur=tok;}
    else cur+=tok;
    while(w(cur)>maxW&&cur.length>1){
      let i=cur.length-1;
      while(i>1&&w(cur.slice(0,i))>maxW)i--;
      out.push(cur.slice(0,i));cur=cur.slice(i);
    }
  };
  for(const ch of String(text)){
    if(ch===' '){place(word);word='';if(cur)cur+=' ';}
    else if(/[0-9A-Za-z$%^&*()+=@#/_.,;:!?'"\\|[\]{}<>~-]/.test(ch)){word+=ch;}
    else{place(word);word='';
      if(cur&&w(cur+ch)>maxW){out.push(cur);cur=ch;}
      else cur+=ch;}
  }
  place(word);
  if(cur)out.push(cur);
  return out.length?out:[''];
}
function pLines(ctx,text,font,maxW,maxLines){
  ctx.font=font;
  const ls=pWrap(ctx,text,maxW);
  if(maxLines&&ls.length>maxLines){
    const cut=ls.slice(0,maxLines);
    let last=cut[maxLines-1];
    while(last.length&&ctx.measureText(last+'…').width>maxW)last=last.slice(0,-1);
    cut[maxLines-1]=last+'…';
    return cut;
  }
  return ls;
}
/* 第一遍：纯测量，算出总高 H 与所有换行结果；第二遍按同一份布局绘制 */
function buildLayout(c,theme,themeDeep,m){
  const W=POSTER.w,pad=POSTER.pad;
  const cardX=pad,cardW=W-pad*2,inner=36;
  const cx=cardX+inner,cw=cardW-inner*2;
  const colGap=24,colW=Math.floor((cw-colGap)/2);
  const F={
    name:'800 46px '+PFONT,idLbl:'600 12px '+PFONT,idTxt:'600 22px '+PFONT,
    lawName:'700 20px '+PFONT,tag:'600 15px '+PFONT,txt:'400 18px '+PFONT,
    badge:'600 15px '+PFONT,num:'900 92px '+PFONT,small:'600 12px '+PFONT,
    env:'400 16px '+PFONT,foot:'400 11px '+PFONT,rev:'400 15px '+PFONT,digit:'600 12px '+PFONT
  };
  const isQuit=c.type==='quit';
  const L={W,pad,cardX,cardW,cx,cw,colW,colGap,F,isQuit,theme,themeDeep,
    badgeTxt:isQuit?I18N.t('－ 戒除'):I18N.t('＋ 养成'),
    footTxt:isQuit?I18N.t('习惯卡 · －戒除'):I18N.t('习惯卡 · ＋养成'),
    date:iso(new Date())};
  let y=pad+inner;
  /* 顶部行：徽标 + 序号 */
  m.font=F.badge;
  const badgeW=Math.ceil(m.measureText(L.badgeTxt).width)+30;
  L.badge={x:cx,y:y,w:badgeW,h:38};
  const numTxt=pad2(Math.min(c.no,99));
  m.font=F.num;
  L.num={txt:numTxt,w:m.measureText(numTxt).width,baseY:y+58,cy:y+25};
  y+=72;
  /* 标题：最多 3 行 */
  const tLines=pLines(m,c.title||I18N.t('未命名习惯'),F.name,cw,3);
  L.title={lines:tLines,top:y+8,lh:62};
  y+=8+tLines.length*62;
  /* 身份 / 替代动作 */
  y+=18;
  const idLines=c.identity?pLines(m,c.identity,F.idTxt,cw-32,2):[];
  L.id={y,h:16+15+(idLines.length?idLines.length*32+4:0)+12,lines:idLines,
        lbl:isQuit?I18N.t('替代动作'):I18N.t('身份')};
  y+=L.id.h;
  /* 四栏：2×2，同行等高；未填写的行整行不画 */
  y+=20;
  L.laws=[];
  for(let r=0;r<4;r+=2){
    const pair=[];
    for(let off=0;off<2;off++){
      const bi=r+off,b=c.blocks&&c.blocks[bi];
      if(!b)continue;
      const digit=(String(b.n).replace(/[^0-9]/g,''))||String(bi+1);
      const rows=[];
      (b.rows||[]).forEach(rw=>{
        if(!rw.text)return;
        m.font=F.tag;
        const tagW=Math.min(m.measureText(rw.tag).width,120);
        const lines=pLines(m,rw.text,F.txt,colW-36-tagW-12,99);
        rows.push({tag:rw.tag,tagW,lines,h:Math.max(22,lines.length*31)});
      });
      const h=18+22+12+rows.reduce((s,r0)=>s+r0.h,0)+Math.max(0,rows.length-1)*10+16;
      pair.push({digit,title:b.title,rows,h,x:cx+(bi%2)*(colW+colGap)});
    }
    if(!pair.length)break;
    const ph=pair.reduce((s,p)=>Math.max(s,p.h),0);
    pair.forEach(p=>{p.h=ph;});
    L.laws.push({y,pair,ph});
    y+=ph+(r===0?16:0);
  }
  /* 环境 */
  if(c.env){
    y+=20;
    const lines=pLines(m,c.env,F.env,cw-32,2);
    L.env={y,h:14+16+lines.length*26+12,lines};
    y+=L.env.h;
  }
  /* 周复盘 */
  if(c.review){
    y+=20;
    const lines=pLines(m,c.review,F.rev,cw-52,3);
    L.rev={y,h:12+16+lines.length*26+12,lines};
    y+=L.rev.h;
  }
  L.contentEnd=y;
  L.H=Math.max(1350,y+68+pad);        /* 页脚区 68，整图最小高 1350 */
  L.cardBottom=L.H-pad;
  L.divY=L.cardBottom-52;
  return L;
}
function exportPoster(c){
  const cs=getComputedStyle(app);
  const theme=(cs.getPropertyValue('--theme')||'').trim()||'#C0392B';
  const themeDeep=(cs.getPropertyValue('--theme-deep')||'').trim()||'#1f1d1a';
  const m=document.createElement('canvas').getContext('2d');   /* 仅测量用 */
  const L=buildLayout(c,theme,themeDeep,m);
  const cv=document.createElement('canvas');
  cv.width=L.W*2;cv.height=L.H*2;      /* 2 倍图：2160px 宽 */
  const ctx=cv.getContext('2d');
  ctx.scale(2,2);
  const{W,pad,cardX,cardW,cx,cw,colW,F}=L;
  /* 页面底 + 卡 */
  ctx.fillStyle=POSTER.bg;ctx.fillRect(0,0,W,L.H);
  rrect(ctx,cardX,pad,cardW,L.cardBottom-pad,POSTER.radius);
  ctx.fillStyle=POSTER.cardBg;ctx.fill();
  if(L.isQuit){ctx.strokeStyle='rgba(31,29,26,.15)';ctx.lineWidth=1;ctx.stroke();}
  /* 戒除卡折角：bg 三角盖掉圆角，再画斜边 */
  if(L.isQuit){
    const x2=cardX+cardW;
    ctx.fillStyle=POSTER.bg;
    ctx.beginPath();ctx.moveTo(x2-23,pad);ctx.lineTo(x2,pad);ctx.lineTo(x2,pad+23);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(31,29,26,.16)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x2-23,pad);ctx.lineTo(x2,pad+23);ctx.stroke();
  }
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  /* 类型徽标 */
  ctx.fillStyle=rgba(L.theme,.12);
  rrect(ctx,L.badge.x,L.badge.y,L.badge.w,L.badge.h,19);ctx.fill();
  ctx.fillStyle=L.themeDeep;ctx.font=F.badge;
  ctx.fillText(L.badgeTxt,L.badge.x+15,L.badge.y+25);
  /* 序号（戒除卡带斜切划痕） */
  ctx.font=F.num;ctx.textAlign='right';
  ctx.globalAlpha=.13;ctx.fillStyle=L.theme;
  ctx.fillText(L.num.txt,cx+cw,L.num.baseY);
  ctx.globalAlpha=1;
  if(L.isQuit){
    ctx.save();
    ctx.translate(cx+cw-L.num.w/2,L.num.cy);
    ctx.rotate(-12*Math.PI/180);
    ctx.globalAlpha=.35;ctx.fillStyle=L.theme;
    rrect(ctx,-L.num.w*0.56-8,-2,L.num.w*1.12+16,4,2);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
  /* 标题 */
  ctx.fillStyle=POSTER.ink;ctx.font=F.name;
  L.title.lines.forEach((ln,i)=>ctx.fillText(ln,cx,L.title.top+40+62*i));
  /* 身份 / 替代动作 */
  ctx.fillStyle=rgba(L.theme,.07);
  rrect(ctx,cx,L.id.y,cw,L.id.h,16);ctx.fill();
  ctx.fillStyle=POSTER.ink3;ctx.font=F.idLbl;
  ctx.fillText(L.id.lbl,cx+16,L.id.y+27);
  ctx.fillStyle=POSTER.ink;ctx.font=F.idTxt;
  L.id.lines.forEach((ln,i)=>ctx.fillText(ln,cx+16,L.id.y+53+32*i));
  /* 四栏 */
  L.laws.forEach(g=>{
    g.pair.forEach(bl=>{
      const by=g.y;
      ctx.fillStyle=rgba(L.theme,.04);
      rrect(ctx,bl.x,by,colW,bl.h,18);ctx.fill();
      const ccx=bl.x+18+11,ccy=by+18+11;
      ctx.beginPath();ctx.arc(ccx,ccy,11,0,Math.PI*2);
      if(!L.isQuit){ctx.fillStyle=L.theme;ctx.fill();}
      else{ctx.strokeStyle=L.theme;ctx.lineWidth=1.5;ctx.stroke();}
      ctx.font=F.digit;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=L.isQuit?L.themeDeep:'#fff';
      ctx.fillText(bl.digit,ccx,ccy+1);
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
      ctx.fillStyle=POSTER.ink;ctx.font=F.lawName;
      ctx.fillText(bl.title,bl.x+18+22+10,by+35);
      let ry=by+18+22+12;
      bl.rows.forEach(r0=>{
        ctx.fillStyle=POSTER.ink3;ctx.font=F.tag;
        ctx.fillText(r0.tag,bl.x+18,ry+15);
        ctx.fillStyle=POSTER.ink2;ctx.font=F.txt;
        r0.lines.forEach((ln,i)=>ctx.fillText(ln,bl.x+18+r0.tagW+12,ry+22+31*i));
        ry+=r0.h+10;
      });
    });
  });
  /* 环境：虚线框 */
  if(L.env){
    ctx.setLineDash([6,5]);
    ctx.strokeStyle='rgba(31,29,26,.22)';ctx.lineWidth=1;
    rrect(ctx,cx,L.env.y,cw,L.env.h,16);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=POSTER.ink3;ctx.font=F.small;
    ctx.fillText(I18N.t('环境'),cx+16,L.env.y+25);
    ctx.fillStyle=POSTER.ink2;ctx.font=F.env;
    L.env.lines.forEach((ln,i)=>ctx.fillText(ln,cx+16,L.env.y+47+26*i));
  }
  /* 周复盘：左 2px 竖线 + 浅底 */
  if(L.rev){
    ctx.fillStyle='rgba(31,29,26,.03)';
    rrect(ctx,cx,L.rev.y,cw,L.rev.h,12);ctx.fill();
    ctx.fillStyle=L.theme;
    ctx.fillRect(cx,L.rev.y+10,2,L.rev.h-20);
    ctx.fillStyle=POSTER.ink3;ctx.font=F.small;
    ctx.fillText(I18N.t('本周复盘'),cx+16,L.rev.y+24);
    ctx.fillStyle=POSTER.ink2;ctx.font=F.rev;
    L.rev.lines.forEach((ln,i)=>ctx.fillText(ln,cx+16,L.rev.y+45+26*i));
  }
  /* 页脚 */
  ctx.fillStyle=POSTER.line;
  ctx.fillRect(cx,L.divY,cw,1);
  ctx.fillStyle=POSTER.ink3;ctx.font=F.foot;
  ctx.fillText(L.footTxt,cx,L.divY+22);
  ctx.textAlign='right';
  ctx.fillText(L.date,cx+cw,L.divY+22);
  ctx.textAlign='left';
  /* 下载 */
  cv.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const safe=(c.title||'未命名习惯').replace(/\s+/g,'').replace(/[\\/:*?"<>|]/g,'').slice(0,20)||'未命名习惯';
    a.download='习惯卡_'+pad2(Math.min(c.no,99))+'_'+safe+'_'+iso(new Date())+'.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  },'image/png');
}

/* ================= 导出 / 导入 ================= */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=I18N.t('习惯卡备份_')+iso(new Date())+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('已导出备份文件');
}
function importData(e){
  const f=e.target.files[0];
  e.target.value='';
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.cards))throw new Error('bad');
      if(state.cards.length&&!confirm('导入将覆盖当前全部卡片与记录，确定继续？'))return;
      state=normalize(d);
      renumber();save();editing=false;
      renderCurrent(false);
      toast('已导入 '+state.cards.length+' 张卡');
    }catch(err){toast('导入失败：文件格式不正确');}
  };
  rd.onerror=()=>toast('导入失败：文件读取错误');
  rd.readAsText(f,'utf-8');
}
let toastTimer=null;
function toast(msg){
  let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(),300);
  },1800);
}

/* ================= 路由（View Transitions + 降级） ================= */
/* 主题三档：日间 / 夜间 / 跟随系统（localStorage hc_theme） */
function applyThemeMode(){
  const v=localStorage.getItem('hc_theme')||'auto';
  document.documentElement.dataset.theme=v;
  const dk=v==='dark'||(v==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.dk=dk?'1':'';
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc)mc.content=dk?'#141519':'#f6f4ef';
  const bt=document.getElementById('btnTheme');
  if(bt)bt.textContent='主题·'+({auto:'自动',light:'日间',dark:'夜间'}[v]||'');
  const host=document.getElementById('goalsHost');
  if(host)host.dataset.dk=dk?'1':'';
}
function cycleTheme(){
  const cur=localStorage.getItem('hc_theme')||'auto';
  const next=({auto:'light',light:'dark',dark:'auto'})[cur]||'auto';
  localStorage.setItem('hc_theme',next);
  applyThemeMode();
  renderCurrent(false);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  if((localStorage.getItem('hc_theme')||'auto')==='auto'){ applyThemeMode(); renderCurrent(false); }
});
let lastHash=null,guideFrom=null;
const scrollMem={};
let suppress=false;
function memScroll(){
  if(lastHash==null)return;
  if(lastHash==='#/'||lastHash.indexOf('#/zone/')===0)scrollMem[lastHash]=window.scrollY;
}
function renderCurrent(immediate){
  closePanel();
  if(!pendingEdit)editing=false;
  const h=location.hash||'#/';
  const zm=h.match(/^#\/zone\/(build|quit)$/);
  const m=h.match(/^#\/card\/([^\/?#]+)/);
  if(m)renderCard(decodeURIComponent(m[1]));
  else if(h==='#/guide')renderGuide();
  else if(zm)renderZone(zm[1]);
  else if(h==='#/goals')renderGoals();
  else renderCover();
  const fh=document.querySelector('[data-focus]');
  if(fh)fh.focus({preventScroll:true});
  const isMem=h==='#/'||h.indexOf('#/zone/')===0;
  const go=()=>{
    if(isMem&&scrollMem[h]!=null)window.scrollTo({top:scrollMem[h],behavior:'instant'});
    else window.scrollTo({top:0,behavior:'instant'});
  };
  if(immediate)go();else requestAnimationFrame(go);   /* 返回列表后一帧恢复滚动位置 */
  if(!document.startViewTransition){                  /* 降级：淡入，避免白屏跳变 */
    app.classList.remove('page-enter');void app.offsetWidth;app.classList.add('page-enter');
  }
  lastHash=h;
}
function navigate(hash,morphId){
  if(hash===location.hash)return;
  memScroll();
  if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches){
    location.hash=hash;return;    /* 降级：hashchange → renderCurrent + 淡入 */
  }
  suppress=true;
  if(morphId){
    const el=document.querySelector('.card[data-id="'+morphId+'"]');
    if(el)el.classList.add('morphing');    /* 旧状态：被点的卡带 morph 名 */
  }
  document.startViewTransition(()=>{
    location.hash=hash;
    renderCurrent(true);
    if(morphId){
      const el=document.querySelector('.card[data-id="'+morphId+'"]');
      if(el)el.classList.add('morphing');  /* 新状态：同名回到列表卡上，反向收回 */
    }
    suppress=false;
  });
}
window.addEventListener('hashchange',()=>{ if(!suppress){memScroll();renderCurrent(false);} });
state=load();
try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
applyThemeMode();
/* 云端快照落到 localStorage 后同步页内内存 state（否则下次 save 会用旧数据覆盖恢复结果） */
document.addEventListener("wbsync:applied", function(){ state=load(); applyThemeMode(); renderCurrent(false); });
/* 登录状态下开机比对云端：云端新→恢复本机；双边改动→弹摘要选择；本地新→自动上传 */
if (typeof SYNC !== 'undefined' && SYNC.isLoggedIn()) {
  SYNC.syncNow().then(function(st){
    if (st.status === 'applied') renderCurrent(false);
    if (st.status === 'conflict') SYNC.openPanel();
  }).catch(function(){});
}
renderCurrent(false);
/* 首访公告：未登录且未勾选「以后不再提示」时，说明数据保存与云同步 */
if (typeof SYNC !== 'undefined' && SYNC.maybeShowNotice) SYNC.maybeShowNotice();

/* PWA：注册 Service Worker（失败静默，不影响正常使用；断网时由 SW 兜底壳与静态资源） */
if ("serviceWorker" in navigator) {
  addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); });
}
